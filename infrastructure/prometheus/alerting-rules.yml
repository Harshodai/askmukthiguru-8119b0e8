groups:
  - name: mukthiguru-slo
    rules:
      # SLO 1 — Chat per-tier latency SLOs (thresholds in backend/app/metrics.py
      # SLO_THRESHOLDS: fast 1s, standard 3s, hindi 12s, cold 25s,
      # comparative 65s, deep/fallback 30s).
      #
      # P2: alerts burn on slo_latency_violations_total, counted per request at
      # observe time against that request's own tier threshold — immune to
      # traffic mix. The old single-le="8.0" histogram alert was dominated by
      # the fastest, highest-volume tier, hiding Hindi/comparative breaches
      # inside a healthy-looking global p95.
      #
      # Multi-window burn-rate pattern (Google SRE Workbook, Ch. 5
      # "Alerting on SLOs"): fast-burn pages on 1h x 5m (>5% violations in
      # BOTH windows), slow-burn tickets on 6h x 30m (>1% violations in BOTH).
      # Both windows must fire together — eliminates short blips while
      # catching sustained budget threats fast.
      - alert: ChatLatencySLOPage
        expr: |
          (
            sum by (tier) (rate(slo_latency_violations_total[1h]))
              / (sum by (tier) (rate(slo_latency_seconds_count[1h])) + 1e-9)
            > 0.05
          )
          and
          (
            sum by (tier) (rate(slo_latency_violations_total[5m]))
              / (sum by (tier) (rate(slo_latency_seconds_count[5m])) + 1e-9)
            > 0.05
          )
        for: 2m
        labels:
          severity: page
          team: oncall
        annotations:
          summary: "Chat per-tier latency budget burning (page)"
          description: "Tier {{ $labels.tier }} violating its SLO on >5% of requests across 1h and 5m windows."
          runbook: "docs/runbooks/ALERTING.md#chatlatencyslopage"

      - alert: ChatLatencySLOHigh
        expr: |
          (
            sum by (tier) (rate(slo_latency_violations_total[6h]))
              / (sum by (tier) (rate(slo_latency_seconds_count[6h])) + 1e-9)
            > 0.01
          )
          and
          (
            sum by (tier) (rate(slo_latency_violations_total[30m]))
              / (sum by (tier) (rate(slo_latency_seconds_count[30m])) + 1e-9)
            > 0.01
          )
        for: 30m
        labels:
          severity: warn
          team: oncall
        annotations:
          summary: "Chat per-tier latency slow burn (warn)"
          description: "Tier {{ $labels.tier }} violating its SLO on >1% of requests across 6h and 30m windows."
          runbook: "docs/runbooks/ALERTING.md#chatlatencyslohigh"

      # Cheap pre-filter: single aggregate counter rate, no per-tier join and
      # no histogram math. Fires informationally whenever ANY tier violates,
      # so on-call sees budget spend starting before the burn-rate pages trip.
      - alert: SLOViolationPresent
        expr: |
          sum(rate(slo_latency_violations_total[10m])) > 0
        for: 5m
        labels:
          severity: info
          team: oncall
        annotations:
          summary: "SLO violations occurring (info)"
          description: "At least one tier is exceeding its per-tier SLO. Check per-tier burn-rate alerts."
          runbook: "docs/runbooks/ALERTING.md#chatlatencyslohigh"

      # SLO 2 — /api/health ready > 99.5%
      - alert: HealthReadySLOPage
        expr: |
          sum(rate(health_check_total{result="not_ready"}[5m]))
            / (sum(rate(health_check_total[5m])) + 1e-9)
          * 100 > 0.5
        for: 15m
        labels:
          severity: page
          team: oncall
        annotations:
          summary: "Readiness probe failing above SLO (page)"
          description: "More than 0.5% of /api/health probes return not_ready in a 15m window."
          runbook: "docs/runbooks/ALERTING.md#healthreadyslopage"

      # SLO 3 — 5xx rate < 0.1%
      - alert: FiveXXRateSLOPage
        expr: |
          sum(rate(guru_requests_total{status=~"5xx"}[5m]))
            / (sum(rate(guru_requests_total[5m])) + 1e-9)
          * 100 > 0.1
        for: 30m
        labels:
          severity: page
          team: oncall
        annotations:
          summary: "5xx rate above 0.1% SLO (page)"
          description: "Server error rate exceeds the 0.1% SLO over a 30m window."
          runbook: "docs/runbooks/ALERTING.md#fivexxrateslopage"

      - alert: FiveXXRateElevated
        expr: |
          sum(rate(guru_requests_total{status=~"5xx"}[10m]))
            / (sum(rate(guru_requests_total[10m])) + 1e-9)
          * 100 > 0.05
        for: 1h
        labels:
          severity: warn
          team: oncall
        annotations:
          summary: "5xx rate elevated"
          description: "Server error rate above 0.05% sustained. Watch for degradation."
          runbook: "docs/runbooks/ALERTING.md#fivexxrateelevated"

      # LLM provider circuit breaker stuck OPEN — every chat request behind it
      # gets the canned "unable to answer" fallback (grounding_state=
      # system_error) instead of an answer. guru_circuit_breaker_state is
      # emitted by services/circuit_breaker.py's _update_gauges()
      # (0=closed, 1=half_open, 2=open) on every state transition.
      - alert: CircuitBreakerStuckOpen
        expr: guru_circuit_breaker_state == 2
        for: 5m
        labels:
          severity: page
          team: oncall
        annotations:
          summary: "LLM provider circuit breaker OPEN for over 5 minutes"
          description: "Circuit breaker for provider {{ $labels.provider }} has been OPEN for >5m — chat requests are served the fallback answer instead of a real response."
          runbook: "docs/runbooks/ALERTING.md#circuitbreakerstuckopen"

      # First-Person Verbatim route (N6) — a quarantine means the serve-time
      # integrity gate (hash mismatch, disallowed speaker, or extraction
      # artifact) caught corrupt data before it reached a seeker. Any
      # increase is worth a look, not just a rate threshold.
      - alert: FirstPersonQuarantineDetected
        expr: |
          increase(first_person_quarantined_total[15m]) > 0
        for: 0m
        labels:
          severity: warning
          team: oncall
        annotations:
          summary: "First-person clip(s) quarantined by the integrity gate"
          description: "{{ $value }} first-person clip(s) failed the serve-time integrity gate in the last 15m. This means corrupt or mis-attributed data reached retrieval and was caught, not that it was served."
          runbook: "docs/runbooks/ALERTING.md#firstpersonquarantinedetected"

      - alert: FirstPersonLatencySLOBreach
        expr: |
          histogram_quantile(0.95, sum(rate(first_person_latency_seconds_bucket[10m])) by (le)) > 1
        for: 10m
        labels:
          severity: warning
          team: oncall
        annotations:
          summary: "First-person verbatim route p95 latency above 1s"
          description: "/api/first-person/query p95 latency has exceeded 1s for 10m."
          runbook: "docs/runbooks/ALERTING.md#firstpersonlatencyslobreach"

      - alert: FirstPersonErrorRateHigh
        expr: |
          sum(rate(first_person_requests_total{status="error"}[10m]))
            / (sum(rate(first_person_requests_total[10m])) + 1e-9)
          * 100 > 5
        for: 10m
        labels:
          severity: critical
          team: oncall
        annotations:
          summary: "First-person verbatim route error rate above 5%"
          description: "More than 5% of /api/first-person/query requests are erroring over a 10m window."
          runbook: "docs/runbooks/ALERTING.md#firstpersonerrateratehigh"
