# ==============================================================================
# AskMukthiGuru — Alertmanager Secret Template
#
# Process with envsubst:
#   envsubst < infrastructure/prometheus/alertmanager.template.yml > /etc/alertmanager/alertmanager.yml
# ==============================================================================

global:
  resolve_timeout: 5m
  slack_api_url: '${SLACK_WEBHOOK_URL}'
  pagerduty_url: 'https://events.pagerduty.com/v2/enqueue'

route:
  receiver: oncall-pager
  group_by: ['alertname', 'team', 'service', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    - match:
        severity: critical
      receiver: oncall-pager
      continue: true
    - match:
        severity: page
      receiver: oncall-pager
      continue: true
    - match:
        severity: warn
      receiver: oncall-slack
      continue: true
    - match:
        alertname: HallucinationAnomaly
      receiver: oncall-pager
      continue: true

receivers:
  - name: oncall-pager
    pagerduty_configs:
      - service_key: '${PD_SERVICE_KEY}'
        url: 'https://events.pagerduty.com/v2/enqueue'
        description: '{{ .GroupLabels.alertname }} — AskMukthiGuru SLO: {{ .CommonAnnotations.summary }}'
        details:
          firing: '{{ .Alerts.Firing | len }}'
          summary: '{{ .CommonAnnotations.summary }}'
          description: '{{ .CommonAnnotations.description }}'
          runbook: '{{ .CommonAnnotations.runbook }}'
          severity: '{{ .CommonLabels.severity }}'
          team: '{{ .CommonLabels.team }}'
          environment: '{{ .CommonLabels.environment }}'
        send_resolved: true

    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '${SLACK_CHANNEL:-#alerts-critical}'
        send_resolved: true
        title: '{{ if eq .Status "firing" }}🚨 [PAGING] {{ .GroupLabels.alertname }}{{ else }}✅ [RESOLVED] {{ .GroupLabels.alertname }}{{ end }}'
        text: >-
          *Summary:* {{ .CommonAnnotations.summary }}
          *Description:* {{ .CommonAnnotations.description }}
          *Severity:* `{{ .CommonLabels.severity }}` | *Team:* `{{ .CommonLabels.team }}`
          *Runbook:* <{{ .CommonAnnotations.runbook }}|Runbook Link>

    webhook_configs:
      - url: '${ALERT_WEBHOOK_URL}'
        send_resolved: true

  - name: oncall-slack
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '${SLACK_CHANNEL:-#alerts}'
        send_resolved: true
        title: '{{ if eq .Status "firing" }}⚠️ [WARN] {{ .GroupLabels.alertname }}{{ else }}✅ [RESOLVED] {{ .GroupLabels.alertname }}{{ end }}'
        text: >-
          {{ range .Alerts }}
          *Alert:* `{{ .Labels.alertname }}` ({{ .Labels.severity }})
          *Summary:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Runbook:* {{ .Annotations.runbook }}
          {{ end }}

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: page
    equal: ['alertname', 'service']

  - source_match:
      severity: page
    target_match:
      severity: warn
    equal: ['alertname', 'service']
