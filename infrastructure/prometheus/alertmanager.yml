route:
  receiver: oncall-pager
  group_by: ["alertname", "team"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    - match:
        severity: page
      receiver: oncall-pager
      continue: true
    - match:
        severity: warn
      receiver: oncall-slack
      continue: true

receivers:
  - name: oncall-pager
    # PagerDuty — set PD_SERVICE_KEY in the environment.
    pagerduty_configs:
      - service_key: "${PD_SERVICE_KEY}"
        description: "{{ .GroupLabels.alertname }} — AskMukthiGuru SLO"
    webhook_configs:
      - url: "${ALERT_WEBHOOK_URL}"

  - name: oncall-slack
    slack_configs:
      - api_url: "${SLACK_WEBHOOK_URL}"
        channel: "#alerts"
        text: "{{ range .Alerts }}{{ .Labels.alertname }}: {{ .Annotations.description }}\n{{ end }}"

inhibit_rules:
  - source_match:
      severity: page
    target_match:
      severity: warn
    equal: ["alertname"]