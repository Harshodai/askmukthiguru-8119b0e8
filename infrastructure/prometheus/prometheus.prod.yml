# ==============================================================================
# AskMukthiGuru — Prometheus Production Scraper & Remote Write Configuration
#
# Secret Injection Pattern (envsubst):
#   envsubst < infrastructure/prometheus/prometheus.prod.yml > /etc/prometheus/prometheus.yml
#
# Required Environment Variables:
#   - METRICS_SCRAPE_TOKEN: the SAME value as the backend's METRICS_SCRAPE_TOKEN
#     (backend/app/api/health.py scrape_metrics serves /internal/metrics with it)
#   - BACKEND_PROD_HOST: Production hostname (e.g. askmukthiguru-8119b0e8-production.up.railway.app)
#   - ALERTMANAGER_HOST: Alertmanager endpoint (default: alertmanager:9093)
#   - GRAFANA_CLOUD_PROMETHEUS_URL: Remote write push URL for Grafana Cloud
#   - GRAFANA_CLOUD_INSTANCE_ID: Grafana Cloud username / instance ID
#   - GRAFANA_CLOUD_API_KEY: Grafana Cloud API key / token
# ==============================================================================

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    environment: 'production'
    service: 'askmukthiguru'
    cluster: 'railway-prod'

rule_files:
  - "alerting-rules.yml"

alerting:
  alertmanagers:
    - scheme: http
      static_configs:
        - targets: ['${ALERTMANAGER_HOST:-alertmanager:9093}']

# Remote write metrics to Grafana Cloud Agent / Managed Prometheus
remote_write:
  - url: '${GRAFANA_CLOUD_PROMETHEUS_URL}'
    basic_auth:
      username: '${GRAFANA_CLOUD_INSTANCE_ID}'
      password: '${GRAFANA_CLOUD_API_KEY}'
    queue_config:
      max_samples_per_send: 1000
      max_shards: 10
      capacity: 5000

scrape_configs:
  # NEW-OPS-1 (OPS-002): this file used to scrape '/api/metrics' (a per-user
  # engagement JSON route behind Supabase auth) and '/metrics' (admin + AAL2).
  # A static bearer token satisfies neither, so both jobs got 401 and every rule
  # in alerting-rules.yml evaluated against an empty series set. The scraper's
  # own credentialed path is '/internal/metrics'. It serves the same exposition
  # and answers 404 while METRICS_SCRAPE_TOKEN is unset, which shows as a DOWN
  # target, not as silence. '/metrics' stays admin-only and is never scraped.
  # Worker and beat serve no metrics path today; their metrics are not scraped.
  - job_name: 'askmukthiguru-backend-prod'
    scheme: https
    metrics_path: '/internal/metrics'
    authorization:
      type: Bearer
      credentials: '${METRICS_SCRAPE_TOKEN}'
    static_configs:
      - targets: ['${BACKEND_PROD_HOST:-askmukthiguru-8119b0e8-production.up.railway.app}']
    relabel_configs:
      - target_label: 'instance'
        replacement: 'railway-backend-prod'
      - target_label: 'environment'
        replacement: 'production'
