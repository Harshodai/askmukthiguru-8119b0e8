global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerting-rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # AMK-F-001: this used to scrape '/metrics', which is admin + AAL2 and
  # answered 401 to every scrape. Prometheus stored nothing, so all six rules in
  # alerting-rules.yml evaluated against an empty series set and could never
  # fire. '/internal/metrics' is the scraper's own credentialed path; it serves
  # the identical exposition and fails closed when METRICS_SCRAPE_TOKEN is unset
  # (404), which shows up here as a DOWN target rather than as silence.
  - job_name: 'mukthiguru-backend'
    metrics_path: '/internal/metrics'
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/scrape_token
    static_configs:
      - targets: ['backend:8000']
