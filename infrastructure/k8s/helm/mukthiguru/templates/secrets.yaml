# REFERENCE ONLY. Not deployed. Source of truth: .railway/railway.ts and docker-compose.prod.yml. Last reviewed (static, no cluster): 2026-11-06. Keep, fix or retire: decision D-PK8S1.
{{- if .Values.secrets.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mukthiguru.fullname" . }}-secrets
  labels:
    {{- include "mukthiguru.labels" . | nindent 4 }}
type: Opaque
data:
  SARVAM_API_KEY: {{ .Values.secrets.SARVAM_API_KEY | default "" | b64enc | quote }}
  NEO4J_PASSWORD: {{ .Values.secrets.NEO4J_PASSWORD | default "" | b64enc | quote }}
  REDIS_PASSWORD: {{ .Values.secrets.REDIS_PASSWORD | default (required "redis.auth.password is required (no default is shipped)" .Values.redis.auth.password) | b64enc | quote }}
  JWT_SECRET: {{ .Values.secrets.JWT_SECRET | default "" | b64enc | quote }}
{{- end }}