# Crisis and domestic-violence helpline registry — single source of truth.
#
# Loaded by backend/services/crisis_helplines.py. Never hardcode a helpline
# number anywhere else (prompts, frontend copy, guardrail rules) — always
# resolve through that module.
#
# ⚠️ VERIFICATION PROVENANCE — READ BEFORE TRUSTING THIS FILE ⚠️
# `last_verified: 2026-09-23` below means: an AI agent cross-checked each
# number against public official sources via web search (org's own site,
# government portal, or equivalent) and the project owner reviewed the
# findings and approved writing the date. This is NOT the same rigor as a
# human actually calling/texting each number to confirm it currently rings,
# is free, and is staffed — that stronger bar (PLAN.md, decisions-needed #2 /
# dossier §7) has not been done. Treat this as "checked against current
# public listings," not "confirmed live." Re-verify before an actual launch
# if a stronger guarantee is needed, and re-check periodically since numbers
# change.
#
# Schema per entry: region, name, contact (the number/text-instruction),
# hours (optional), languages (optional list), source_url (optional, where
# the number was sourced from), last_verified (optional, ISO date the number
# was human-confirmed — absence means NOT YET VERIFIED).

