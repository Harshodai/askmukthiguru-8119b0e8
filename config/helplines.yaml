# Crisis and domestic-violence helpline registry — single source of truth.
#
# Loaded by backend/services/crisis_helplines.py. Never hardcode a helpline
# number anywhere else (prompts, frontend copy, guardrail rules) — always
# resolve through that module.
#
# ⚠️ SAFETY-CRITICAL, HUMAN VERIFICATION REQUIRED BEFORE LAUNCH ⚠️
# Every `last_verified` field below is deliberately unset. An AI agent wrote
# this file from public web sources and CANNOT verify that a phone number
# still rings, is still free, or is still staffed. Per the release brief
# (PLAN.md, decisions-needed #2 / dossier §7): a human must call or
# independently confirm every number, set `last_verified` to the date they
# did so, and this comment block must be updated before this file is treated
# as launch-ready. Do not ship on agent-populated data alone.
#
# Schema per entry: region, name, contact (the number/text-instruction),
# hours (optional), languages (optional list), source_url (optional, where
# the number was sourced from), last_verified (optional, ISO date the number
# was human-confirmed — absence means NOT YET VERIFIED).

