# Crisis and domestic-violence helpline registry — single source of truth.
#
# Loaded by backend/services/crisis_helplines.py. Never hardcode a helpline
# number anywhere else (prompts, frontend copy, guardrail rules) — always
# resolve through that module.
#
# ⚠️ VERIFICATION STATUS & SCHEMA — READ BEFORE TRUSTING THIS FILE ⚠️
# Each entry tracks two distinct verification tiers:
#
#   1. `last_checked_public_listing` (ISO date or null):
#      Date when the number, name, and hours were cross-checked against official
#      public websites or government portals. This confirms the listing exists
#      online but DOES NOT guarantee the line is live or staffed.
#
#   2. `last_verified_by_call` (ISO date or null):
#      Date when a human operator actually placed a live test call or message to
#      confirm the number rings, is free, and is actively staffed by trained
#      responders. Gate G1 (Safety Gate) STRICTLY REQUIRES `last_verified_by_call`.
#      Absence (null) means UNVERIFIED BY CALL and triggers runtime warnings.
#
# Schema per entry:
#   region: Geographic scope (e.g. India, United States, United Kingdom)
#   name: Organization / service name
#   contact: Phone number or text instructions
#   hours: Operating hours (optional)
#   languages: Supported languages (optional list)
#   source_url: Official portal URL where listed (optional)
#   last_checked_public_listing: Date checked against online listing (ISO date or null)
#   last_verified_by_call: Date confirmed by placing a live call (ISO date or null)

