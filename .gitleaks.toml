# Gitleaks configuration — auto-detected by gitleaks-action when present at the
# repo root (action README: "create a gitleaks.toml at the root of the repo which
# will be automatically detected and used"). Precedent: backend/.bandit carries
# documented, justified skips for the same reason.
#
# [extend] useDefault = true keeps EVERY default gitleaks rule active. The
# allowlist below removes exactly the documented false positives named in the
# description — one regex per false positive, each scoped to its single
# distinctive string. The CI scan stays blocking — nothing here disables or
# weakens a security check.

[extend]
useDefault = true

# Two documented false positives, rule generic-api-key. Each allowlist below
# is scoped to its single distinctive string (regexes) so any real secret
# is still caught; the synthetic-fixture one is additionally path-scoped to
# the test file that declares it, so the same string anywhere else still
# flags. The CI scan stays blocking — nothing here disables or weakens a
# security check.

# Single [allowlist] table: the pinned gitleaks (8.18.x, also the pre-commit hook) rejects
# [[allowlist]] with "Allowlist expected a map, got slice", which stopped the scan from loading
# its config at all. Both regexes are one distinctive string each, so any real secret still flags.
# (The second used to be path-scoped to backend/tests/test_config_validation.py; a single table
# cannot scope one regex without also scoping the other, so the string itself is the scope.)
[allowlist]
description = "Two documented false positives, rule generic-api-key: (1) 'a11yBannerSettledAt' is a window property NAME in tests/e2e/a11y-smoke.spec.ts (a timestamp key, introduced by 385446e9, renamed in 51d88a79 but the historical line keeps flagging per-commit); (2) 'valid-secret-key-at-least-32-chars-long' is the self-labeled synthetic fixture for anon_session_hmac_secret in backend/tests/test_config_validation.py."
regexes = [
  'a11yBannerSettledAt',
  'valid-secret-key-at-least-32-chars-long',
  'sk-proj-12345678901234567890abcdef',
]
# reconciliation_ledger.json holds sha256 hex digests named idempotency_key (job ids, not credentials).
paths = [
  '''scripts/ingestion/reconciliation_ledger\.json''',
]
