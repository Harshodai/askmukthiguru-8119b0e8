# Gitleaks configuration — auto-detected by gitleaks-action when present at the
# repo root (action README: "create a gitleaks.toml at the root of the repo which
# will be automatically detected and used"). Precedent: backend/.bandit carries
# documented, justified skips for the same reason.
#
# [extend] useDefault = true keeps EVERY default gitleaks rule active. The
# allowlist below removes exactly the documented false positives named in the
# description — one regex per false positive, each scoped to its single
# distinctive string. The CI scan stays blocking — nothing here disables or
# weakens a security check.

[extend]
useDefault = true

# Two documented false positives, rule generic-api-key. Each allowlist below
# is scoped to its single distinctive string (regexes) so any real secret
# is still caught; the synthetic-fixture one is additionally path-scoped to
# the test file that declares it, so the same string anywhere else still
# flags. The CI scan stays blocking — nothing here disables or weakens a
# security check.

[[allowlist]]
description = "Entropy 3.558519: a Playwright e2e test (tests/e2e/a11y-smoke.spec.ts) stores a window property NAME in a const — 'a11yBannerSettledAt' is a timestamp key, not a credential. Introduced by 385446e9; the variable was renamed in 51d88a79, but gitleaks scans the PR commit range per-commit, so the historical line keeps flagging (confirmed on runs 37910932332 and 37912478920)."
regexes = ['a11yBannerSettledAt']

[[allowlist]]
description = "'valid-secret-key-at-least-32-chars-long' is the deliberately self-labeled synthetic fixture for anon_session_hmac_secret in backend/tests/test_config_validation.py — it reads as its own validity statement, not a credential. Path-scoped to that test file."
paths = ['backend/tests/test_config_validation\\.py$']
regexes = ['valid-secret-key-at-least-32-chars-long']
