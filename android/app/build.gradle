apply plugin: 'com.android.application'

android {
    namespace = "com.askmukthiguru.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.askmukthiguru.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Release signing configuration:
    // Resolves credentials from environment variables or key.properties (local, gitignored)
    // Environment variables take precedence (ideal for CI/CD):
    //   ANDROID_KEYSTORE_PATH, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
    // Local properties file fallback:
    //   android/key.properties or android/app/key.properties
    def keystorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
    def keyAlias = System.getenv("ANDROID_KEY_ALIAS")
    def keyPassword = System.getenv("ANDROID_KEY_PASSWORD")
    def keystorePath = System.getenv("ANDROID_KEYSTORE_PATH")

    def keyPropsFile = rootProject.file('key.properties')
    if (!keyPropsFile.exists()) {
        keyPropsFile = file('key.properties')
    }

    if (keyPropsFile.exists()) {
        def props = new Properties()
        keyPropsFile.withInputStream { props.load(it) }
        keystorePath = keystorePath ?: props.getProperty('storeFile') ?: props.getProperty('storeFilePath') ?: props.getProperty('keystore.path')
        keystorePassword = keystorePassword ?: props.getProperty('storePassword') ?: props.getProperty('keystore.password')
        keyAlias = keyAlias ?: props.getProperty('keyAlias') ?: props.getProperty('key.alias')
        keyPassword = keyPassword ?: props.getProperty('keyPassword') ?: props.getProperty('key.password')
    }

    keystorePath = keystorePath?.trim()
    keystorePassword = keystorePassword?.trim()
    keyAlias = keyAlias?.trim()
    keyPassword = keyPassword?.trim()

    if (keystorePath?.startsWith("~/")) {
        keystorePath = System.getProperty("user.home") + keystorePath.substring(1)
    }

    File keystoreFile = null
    if (keystorePath) {
        def directFile = new File(keystorePath)
        if (directFile.isAbsolute() && directFile.exists()) {
            keystoreFile = directFile
        } else if (rootProject.file(keystorePath).exists()) {
            keystoreFile = rootProject.file(keystorePath)
        } else if (file(keystorePath).exists()) {
            keystoreFile = file(keystorePath)
        }
    }

    boolean hasReleaseKey = keystoreFile != null && keystoreFile.exists() && keystorePassword && keyAlias && keyPassword

    signingConfigs {
        release {
            if (hasReleaseKey) {
                storeFile keystoreFile
                storePassword keystorePassword
                keyAlias keyAlias
                keyPassword keyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseKey) {
                signingConfig signingConfigs.release
            } else {
                if (keystorePath && (keystoreFile == null || !keystoreFile.exists())) {
                    logger.warn("[Release Signing] Specified keystore not found at '${keystorePath}'. Falling back to debug signingConfig.")
                } else {
                    logger.info("[Release Signing] No release keystore configured (checked key.properties & ANDROID_* env vars). Falling back to debug signingConfig.")
                }
                signingConfig signingConfigs.debug
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
