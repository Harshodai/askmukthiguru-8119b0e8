# Edge Functions require a valid JWT by default. The extraction worker is the
# only additional exception: pg_cron/pg_net calls it with an API key, and the
# handler enforces a separate high-entropy CRON_SECRET before any DB access.
# Keep user-facing and user-data functions on JWT verification.
[functions.healthz]
verify_jwt = false

[functions.memory-extract-drain]
verify_jwt = false
