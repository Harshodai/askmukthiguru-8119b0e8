# ============================================================
# Mukthi Guru — Production Docker Compose
# ============================================================
# REQUIRED ENVIRONMENT VARIABLES (set on host before deploying):
#   GHCR_ORG          — GitHub org/user for image registry (e.g., your-github-username)
#   IMAGE_TAG         — Docker image tag (e.g., latest, v1.2.3, or git SHA)
#   SUPABASE_URL      — Supabase project URL
#   SUPABASE_ANON_KEY — Supabase anon key (frontend only)
#   SUPABASE_SERVICE_ROLE_KEY — Supabase service role (backend)
#   REDIS_PASSWORD    — Redis auth password
#   JWT_SECRET        — JWT signing secret
#   LLM_PROVIDER      — LLM provider (sarvam_cloud | ollama)
#   SARVAM_API_KEY    — Sarvam API key (if using sarvam_cloud)
#   NEOREJ_URI      — Neo4j Bolt URI (optional; defaults to managed/external instance)
#
# NOTE: Neo4j is NOT included in this prod compose. Production uses an external
# managed Neo4j instance (Aura or self-hosted on a dedicated node) reachable
# via NEO4J_URI. Local/dev brings Neo4j up via docker-compose.yml. If you must
# run Neo4j in prod here, mirror the dev service and set NEO4J_PLUGINS=["apoc","n10s"].
#
# Usage:
#   export GHCR_ORG=your-org IMAGE_TAG=latest && docker compose -f docker-compose.prod.yml up -d

version: '3.8'

networks:
  mukthiguru:
    driver: bridge
    name: mukthiguru-prod

services:
  # --- Frontend (React + Nginx) ---
  frontend:
    image: ghcr.io/${GHCR_ORG:-your-org}/askmukthiguru-frontend:${IMAGE_TAG:-latest}
    container_name: mukthiguru-frontend-prod
    ports:
      - "80:80"
      - "443:443"
    environment:
      - VITE_SUPABASE_URL=${SUPABASE_URL}
      - VITE_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
    depends_on:
      - backend
    networks:
      - mukthiguru
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
        reservations:
          memory: 128M

  # --- Backend (FastAPI) ---
  backend:
    image: ghcr.io/${GHCR_ORG:-your-org}/askmukthiguru-backend:${IMAGE_TAG:-latest}
    container_name: mukthiguru-backend-prod
    environment:
      - ENV=production
      - LLM_PROVIDER=${LLM_PROVIDER:-sarvam_cloud}
      - SARVAM_API_KEY=${SARVAM_API_KEY}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      # F-PROD-1 2026-09-16: these were absent, so settings.neo4j_uri fell back
      # to its default "bolt://localhost:7687" INSIDE the container -- i.e. the
      # backend itself, not a graph. Every graph call failed by connecting to
      # nothing. Graph degradation is fail-open (retrieval falls back to
      # Qdrant + BM25), so this was silent: no error surfaced, GraphRAG simply
      # never contributed. No graph service is defined in this file by design
      # (see the header comment), so these MUST be supplied from the host env.
      - NEO4J_URI=${NEO4J_URI:?set NEO4J_URI (e.g. bolt://memgraph:7687) or graph retrieval silently no-ops}
      - NEO4J_USER=${NEO4J_USER:-memgraph}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - LMCACHE_CONFIG_FILE=/app/backend/config/lmcache_config.yaml
      # AUDIT FIX 2026-08-01: Docker Compose cannot self-reference env vars within
      # the same 'environment:' block — ${REDIS_URL} above is defined in this block
      # only, not on the host, so it would resolve to empty string. Use explicit URL.
      - LMCACHE_REMOTE_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      # Memory limit for Python process (set in main.py via resource.setrlimit)
      - PYTHON_MEMORY_LIMIT_MB=${PYTHON_MEMORY_LIMIT_MB:-2048}
      # Workers: 2 for production. Each loads the embedding model (~1.4GB each).
      # Ensure the host has ≥4GB RAM available.
      - WEB_CONCURRENCY=2
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mukthiguru
    healthcheck:
      # F-PROD-1 2026-09-16: was /api/health -- the COMPREHENSIVE per-service
      # check (Qdrant, embedding probe, OCR, graph, cache telemetry). Wrong
      # endpoint for a liveness probe on two counts: it is expensive to run
      # every 30s, and it reports unhealthy when a NON-critical dependency is
      # down, so a degraded-but-serving backend gets restarted in a loop.
      # /api/healthz is the cheap liveness endpoint (see start_railway.py).
      # Use /api/health for readiness/diagnostics, never for restart decisions.
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          cpus: "2.0"
          memory: 3G
        reservations:
          memory: 512M

  # --- Vector DB (Qdrant) ---
  qdrant:
    image: qdrant/qdrant:v1.18.0
    container_name: mukthiguru-qdrant-prod
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - mukthiguru
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          memory: 512M

  # --- Cache (Redis) ---
  redis:
    image: redis:7-alpine
    container_name: mukthiguru-redis-prod
    # F-PROD-1 2026-09-16: was --maxmemory-policy allkeys-lru. This one Redis
    # serves two workloads with different durability requirements: evictable
    # caches (semantic/exact/doctrine) and NON-evictable counters (anonymous
    # chat quota, rate limits, sessions). allkeys-lru let memory pressure
    # silently delete a quota counter, which reads as "this user has sent 0
    # messages" -- a billing hole, not a cache miss. volatile-lru does not help:
    # the quota keys carry TTLs too, so they stay eligible.
    # noeviction instead: when full, writes fail loudly. Both consumers already
    # handle that correctly -- the cache adapters fail open to a miss, and
    # AnonQuotaRedisAdapter catches RedisError and degrades to its in-process
    # fallback at the conservative limit (backend/CLAUDE.md, finding FD-1).
    # ponytail: one instance, policy set to the stricter consumer's needs.
    # Split cache onto its own Redis/db and restore allkeys-lru there if cache
    # evictions ever start mattering for latency.
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 512mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    networks:
      - mukthiguru
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 600M
        reservations:
          memory: 128M

volumes:
  qdrant_data:
  redis_data:
