name: Pre-launch gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_url:
        description: "Run the gate against a deployed URL instead of the local dev server"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  prelaunch:
    name: build + unit + e2e
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # rls-cross-user.spec.ts needs a real Supabase to prove tenant isolation.
      # Start a throwaway local stack from supabase/migrations so the gate needs
      # no repository secrets and never touches a real project. Failure here
      # fails the job on purpose: skipping would report isolation as proven.
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase (ephemeral, no secrets)
        run: |
          supabase start -x studio,imgproxy,inbucket,edge-runtime,logflare,vector,supavisor
          supabase status -o env > "$RUNNER_TEMP/supabase.env"
          {
            echo "LOCAL_SUPABASE_URL=$(grep '^API_URL=' "$RUNNER_TEMP/supabase.env" | cut -d= -f2- | tr -d '"')"
            echo "LOCAL_SUPABASE_ANON_KEY=$(grep '^ANON_KEY=' "$RUNNER_TEMP/supabase.env" | cut -d= -f2- | tr -d '"')"
            echo "LOCAL_SUPABASE_SERVICE_ROLE_KEY=$(grep '^SERVICE_ROLE_KEY=' "$RUNNER_TEMP/supabase.env" | cut -d= -f2- | tr -d '"')"
          } >> "$GITHUB_ENV"
          # Mask the keys in later logs.
          grep -E '^(ANON_KEY|SERVICE_ROLE_KEY)=' "$RUNNER_TEMP/supabase.env" | cut -d= -f2- | tr -d '"' | while read -r v; do echo "::add-mask::$v"; done

      - name: Run pre-launch gate
        env:
          CI: "true"
          BASE_URL: ${{ github.event.inputs.base_url }}
          # The gate mocks the backend: the local-Docker preflight's compose
          # env (E003) and live-backend (E004/E005) checks do not apply here.
          PRELAUNCH_SKIP_ENV: "1"
          PRELAUNCH_SKIP_BACKEND: "1"
          # Explicit override: the CI gate has no compose stack. Verdict prints GREEN WITH SKIPS.
          PRELAUNCH_ALLOW_SKIPS: "1"
          # Public placeholders unblock the local production build on forks and
          # repos without credentials. E2E suites use fake browser sessions for
          # their auth wiring checks; real provider/staging tests remain separate.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://mock-supabase.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'mock-anon-key-for-ci-build' }}
          # Local ephemeral stack started above, never repository secrets.
          SUPABASE_URL: ${{ env.LOCAL_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ env.LOCAL_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.LOCAL_SUPABASE_SERVICE_ROLE_KEY }}
          TEST_USER_EMAIL: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY && format('preflight+{0}@example.com', github.run_id) || '' }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        run: |
          chmod +x scripts/prelaunch.sh
          scripts/prelaunch.sh

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}-chromium-gate
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload failure artifacts (screenshots, videos, traces)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures-${{ github.run_id }}-chromium-gate
          path: |
            test-results/
            playwright-screenshots/
          retention-days: 14
          if-no-files-found: ignore

  ui-device-matrix:
    name: UI device matrix (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        project:
          - chromium
          - firefox
          - webkit
          - Mobile Chrome
          - Mobile Safari

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run critical UI suites
        env:
          CI: "true"
          BASE_URL: ${{ github.event.inputs.base_url }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://mock-supabase.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'mock-anon-key-for-ci-build' }}
        run: |
          npm run build
          npx playwright test --project="${{ matrix.project }}" \
            tests/e2e/page-smoke.spec.ts \
            tests/e2e/a11y-smoke.spec.ts \
            tests/e2e/prelaunch-sweep.spec.ts \
            tests/e2e/full-regression.spec.ts
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}-${{ matrix.project }}
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload failure artifacts (screenshots, videos, traces)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures-${{ github.run_id }}-${{ matrix.project }}
          path: |
            test-results/
            playwright-screenshots/
          retention-days: 14
          if-no-files-found: ignore
