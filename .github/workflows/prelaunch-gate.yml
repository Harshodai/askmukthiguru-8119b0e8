name: Pre-launch gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_url:
        description: "Run the gate against a deployed URL instead of the local dev server"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  prelaunch:
    name: build + unit + e2e
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # rls-cross-user is the only executable proof that user A cannot read user
      # B's data, so the gate must never skip it. It has no mock path: it
      # creates Alice/Bob against Supabase Auth over REST and signs them in
      # through the built bundle. scripts/prelaunch.sh:226-234 already hard-fails
      # loudly when no Supabase is reachable instead of skipping green — it was
      # failing only because nothing ever provisioned one in this job.
      #
      # Provision the documented alternative: a local stack on :54321. Nothing
      # else needs wiring — playwright.config.ts discoverLocalSupabaseEnv() and
      # rls-cross-user.spec.ts discoverSupabaseConfig() both already read
      # `npx supabase status --output json`, and the webServer command prefixes
      # its result ahead of the inherited VITE_SUPABASE_* placeholders, so the
      # preview bundle is rebuilt against this stack automatically.
      - name: Start local Supabase (rls-cross-user backend)
        run: |
          npx supabase start
          # Prints API_URL/ANON_KEY/SERVICE_ROLE_KEY on success and fails the
          # job on error; also proves the stack's own migrations applied.
          npx supabase status --output json

      - name: Run pre-launch gate
        env:
          CI: "true"
          BASE_URL: ${{ github.event.inputs.base_url }}
          # The gate mocks the backend: the local-Docker preflight's compose
          # env (E003) and live-backend (E004/E005) checks do not apply here.
          PRELAUNCH_SKIP_ENV: "1"
          PRELAUNCH_SKIP_BACKEND: "1"
          # Public placeholders unblock the local production build on forks and
          # repos without credentials. Suites that mock auth use them unchanged.
          # rls-cross-user does NOT: it rebuilds the preview bundle against the
          # local stack started above, because discoverLocalSupabaseEnv() emits
          # VITE_SUPABASE_URL/VITE_SUPABASE_PUBLISHABLE_KEY as command-prefix
          # assignments, which override these inherited values.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://mock-supabase.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'mock-anon-key-for-ci-build' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TEST_USER_EMAIL: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY && format('preflight+{0}@example.com', github.run_id) || '' }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        run: |
          chmod +x scripts/prelaunch.sh
          scripts/prelaunch.sh

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}-chromium-gate
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload failure artifacts (screenshots, videos, traces)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures-${{ github.run_id }}-chromium-gate
          path: |
            test-results/
            playwright-screenshots/
          retention-days: 14
          if-no-files-found: ignore

  ui-device-matrix:
    name: UI device matrix (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        project:
          - chromium
          - firefox
          - webkit
          - Mobile Chrome
          - Mobile Safari

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run critical UI suites
        env:
          CI: "true"
          BASE_URL: ${{ github.event.inputs.base_url }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://mock-supabase.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'mock-anon-key-for-ci-build' }}
        run: |
          npm run build
          npx playwright test --project="${{ matrix.project }}" \
            tests/e2e/page-smoke.spec.ts \
            tests/e2e/a11y-smoke.spec.ts \
            tests/e2e/prelaunch-sweep.spec.ts \
            tests/e2e/full-regression.spec.ts
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}-${{ matrix.project }}
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload failure artifacts (screenshots, videos, traces)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures-${{ github.run_id }}-${{ matrix.project }}
          path: |
            test-results/
            playwright-screenshots/
          retention-days: 14
          if-no-files-found: ignore
