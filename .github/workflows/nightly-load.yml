name: Nightly Load Test (OPS-7)

# Nightly engineering evidence. A missing benchmark endpoint is NOT silently
# green: it produces an explicit NO_BACKEND_EVIDENCE failure unless the
# diagnostic-only workflow input ALLOW_UNREACHABLE_SUCCESS is deliberately set.
# This workflow never creates PRs or deploys application code.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      allow_unreachable_success:
        description: 'Diagnostic-only: allow the run to pass when no backend is reachable'
        required: false
        default: false
        type: boolean

env:
  LOAD_TEST_URL: ${{ secrets.LOAD_TEST_URL || 'http://127.0.0.1:8000' }}
  BENCHMARK_SECRET: ${{ secrets.BENCHMARK_SECRET || 'dev-secret-not-set' }}
  ALLOW_UNREACHABLE_SUCCESS: ${{ inputs.allow_unreachable_success || 'false' }}

jobs:
  load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install load-test dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Boot local stack with mock LLM when no remote URL is configured
        if: env.LOAD_TEST_URL == 'http://127.0.0.1:8000'
        run: |
          set -euo pipefail
          python backend/scripts/mock_llm_server.py --port 9002 &
          echo "MOCK_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9002/ >/dev/null && break
            sleep 1
          done
          docker compose up -d qdrant redis
          LLM_PROVIDER=nim NIM_API_KEY=mock NIM_BASE_URL=http://host.docker.internal:9002/v1 \
            docker compose up -d backend
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/api/healthz >/dev/null && break
            sleep 2
          done

      - name: Reachability gate — hard no-evidence signal
        id: reachable
        run: |
          set -euo pipefail
          if curl -sf --max-time 5 "$LOAD_TEST_URL/api/healthz" >/dev/null; then
            echo "backend reachable at $LOAD_TEST_URL"
            echo "reachable=true" >> "$GITHUB_OUTPUT"
          else
            echo "NO_BACKEND_EVIDENCE: backend NOT reachable at $LOAD_TEST_URL"
            echo "reachable=false" >> "$GITHUB_OUTPUT"
            if [ "$ALLOW_UNREACHABLE_SUCCESS" != "true" ]; then
              exit 1
            fi
            echo "WARNING: diagnostic override explicitly allowed this run to continue green."
          fi

      - name: Load sweep — concurrency 20 gate
        if: steps.reachable.outputs.reachable == 'true'
        working-directory: backend
        run: locust -f benchmarks/locustfile.py --headless -u 20 -r 5 -t 90s --host "$LOAD_TEST_URL" --json > /tmp/locust-20.json
        env:
          LOAD_TEST_URL: ${{ env.LOAD_TEST_URL }}
          BENCHMARK_SECRET: ${{ env.BENCHMARK_SECRET }}

      - name: Load sweep — concurrency 50 backpressure gate
        if: steps.reachable.outputs.reachable == 'true'
        working-directory: backend
        run: locust -f benchmarks/locustfile.py --headless -u 50 -r 10 -t 90s --host "$LOAD_TEST_URL" --json > /tmp/locust-50.json
        env:
          LOAD_TEST_URL: ${{ env.LOAD_TEST_URL }}
          BENCHMARK_SECRET: ${{ env.BENCHMARK_SECRET }}

      - name: Assert gates
        if: steps.reachable.outputs.reachable == 'true'
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import json, sys

          def summarize(path):
              data = json.load(open(path))
              stats = data.get("stats", [])
              total = next((s for s in stats if s.get("name") == "Total"), None)
              if not total:
                  raise SystemExit(f"FAIL: no Total stats in {path}")
              return {
                  "reqs": total.get("num_requests", 0),
                  "fails": total.get("num_failures", 0),
                  "p95": total.get("response_time_percentile_95", 0) / 1000.0,
                  "rps": total.get("total_rps", 0),
              }

          s = summarize("/tmp/locust-20.json")
          print(f"[c20] reqs={s['reqs']} rps={s['rps']:.1f} p95={s['p95']:.2f}s fails={s['fails']}")
          if s["fails"] > 0:
              sys.exit("FAIL: hard failures at concurrency 20")
          if s["reqs"] == 0:
              sys.exit("FAIL: zero requests means no performance evidence")
          if s["p95"] >= 8.0:
              sys.exit("FAIL: p95 >= 8s gate at concurrency 20")

          s50 = summarize("/tmp/locust-50.json")
          print(f"[c50] reqs={s50['reqs']} rps={s50['rps']:.1f} p95={s50['p95']:.2f}s fails={s50['fails']}")
          if s50["reqs"] == 0:
              sys.exit("FAIL: zero requests means no backpressure evidence")
          if s50["fails"] > 0:
              sys.exit("FAIL: hard failures at concurrency 50")
          EOF

      - name: Chaos test — Qdrant kill mid-traffic
        if: steps.reachable.outputs.reachable == 'true'
        working-directory: backend
        run: python scripts/chaos_qdrant_kill.py --endpoint "$LOAD_TEST_URL" --traffic-seconds 20
        env:
          LOAD_TEST_URL: ${{ env.LOAD_TEST_URL }}
          BENCHMARK_SECRET: ${{ env.BENCHMARK_SECRET }}

      - name: Upload load reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-load-reports
          path: /tmp/locust-*.json
          if-no-files-found: error
          retention-days: 30

      - name: Kill mock LLM
        if: always()
        run: |
          if [ -n "${MOCK_PID:-}" ]; then
            kill "$MOCK_PID" || true
          fi
