name: Nightly Memory Dreaming Consolidation

on:
  schedule:
    - cron: '30 21 * * *'  # 03:00 IST (21:30 UTC) every night
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Execute dreaming consolidation in dry-run mode (no writes)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  dreaming:
    name: Run Sleep-Time Memory Consolidation
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r backend/requirements.lock

      - name: Verify Memory Dreaming Tests & Contracts
        run: |
          cd backend
          python -m pytest tests/test_repo_layout.py tests/test_seeker_core_dashboard.py tests/test_memory_dreamer.py tests/test_canonical_memory_api.py -v
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          JWT_SECRET: dummy-jwt-secret-key-for-ci-runs
          OPENROUTER_API_KEY: mock-openrouter-key-for-ci
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"

      - name: Execute Sleep-Time Consolidation Worker
        run: |
          cd backend
          export PYTHONPATH="${{ github.workspace }}/backend"
          DRY_ARG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_ARG="--dry-run"
          fi
          python -m scripts.dream_memories --all $DRY_ARG || true
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          QDRANT_HOST: ${{ secrets.QDRANT_HOST }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
