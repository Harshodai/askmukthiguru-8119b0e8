name: Eval Gate (RAGAS Faithfulness + Context Metrics)

# Blocks merge / deploy when faithfulness, context precision, or context recall
# on the golden disciple set regress below the threshold. Runs on PRs touching
# backend RAG code and as a nightly canary on main.

on:
  pull_request:
    paths:
      - 'backend/rag/**'
      - 'backend/services/**'
      - 'backend/evaluation/**'
      - 'backend/app/main.py'
      - 'backend/app/pipeline/**'
      - 'backend/app/config.py'
      - 'backend/evaluation/golden_dataset.json'
  schedule:
    - cron: '0 2 * * *' # 02:00 UTC nightly
  workflow_dispatch:

env:
  FAITHFULNESS_THRESHOLD: '0.88'
  ANSWER_RELEVANCY_THRESHOLD: '0.80'
  CONTEXT_PRECISION_THRESHOLD: '0.72'
  CONTEXT_RECALL_THRESHOLD: '0.72'
  DIVERSITY_MIN_DISTINCT_SOURCES: '2'

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install eval deps
        run: |
          pip install ragas==0.2.6 datasets pandas httpx pydantic

      - name: Run golden eval
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          BACKEND_TOKEN: ${{ secrets.BACKEND_TOKEN }}
          LOVABLE_API_KEY: ${{ secrets.LOVABLE_API_KEY }}
        run: |
          python backend/evaluation/run_golden_eval.py \
            --dataset backend/evaluation/golden_dataset.json \
            --out eval_report.json \
            --faithfulness-min "$FAITHFULNESS_THRESHOLD" \
            --relevancy-min "$ANSWER_RELEVANCY_THRESHOLD" \
            --context-precision-min "$CONTEXT_PRECISION_THRESHOLD" \
            --context-recall-min "$CONTEXT_RECALL_THRESHOLD" \
            --min-distinct-sources "$DIVERSITY_MIN_DISTINCT_SOURCES"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval_report.json

      - name: Write results to job summary
        if: always()
        run: |
          if [ ! -f eval_report.json ]; then
            echo "### 🪷 RAGAS Eval Gate — no report produced" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          r = json.load(open("eval_report.json"))
          def mark(p): return "✅" if p else "❌"
          lines = [
              "### 🪷 RAGAS Eval Gate",
              "",
              "| metric | value | threshold | pass |",
              "|---|---|---|---|",
              f"| faithfulness | {r.get('faithfulness'):.3f} | {os.environ['FAITHFULNESS_THRESHOLD']} | {mark(r.get('faithfulness_pass'))} |",
              f"| answer_relevancy | {r.get('answer_relevancy'):.3f} | {os.environ['ANSWER_RELEVANCY_THRESHOLD']} | {mark(r.get('relevancy_pass'))} |",
              f"| context_precision | {r.get('context_precision'):.3f} | {os.environ['CONTEXT_PRECISION_THRESHOLD']} | {mark(r.get('context_precision_pass'))} |",
              f"| context_recall | {r.get('context_recall'):.3f} | {os.environ['CONTEXT_RECALL_THRESHOLD']} | {mark(r.get('context_recall_pass'))} |",
              f"| source_diversity | {r.get('diversity_violations')} violations | 0 | {mark(r.get('diversity_violations') == 0)} |",
              "",
              f"Run: {r.get('questions_total')} questions, {r.get('questions_failed')} failed to answer.",
          ]
          print("\n".join(lines))
          PY
        env:
          FAITHFULNESS_THRESHOLD: ${{ env.FAITHFULNESS_THRESHOLD }}
          ANSWER_RELEVANCY_THRESHOLD: ${{ env.ANSWER_RELEVANCY_THRESHOLD }}
          CONTEXT_PRECISION_THRESHOLD: ${{ env.CONTEXT_PRECISION_THRESHOLD }}
          CONTEXT_RECALL_THRESHOLD: ${{ env.CONTEXT_RECALL_THRESHOLD }}

      - name: Comment summary on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('eval_report.json')) return;
            const r = JSON.parse(fs.readFileSync('eval_report.json', 'utf8'));
            const body = [
              '### 🪷 RAGAS Eval Gate',
              '',
              `| metric | value | threshold | pass |`,
              `|---|---|---|---|`,
              `| faithfulness | ${r.faithfulness?.toFixed(3)} | ${process.env.FAITHFULNESS_THRESHOLD} | ${r.faithfulness_pass ? '✅' : '❌'} |`,
              `| answer_relevancy | ${r.answer_relevancy?.toFixed(3)} | ${process.env.ANSWER_RELEVANCY_THRESHOLD} | ${r.relevancy_pass ? '✅' : '❌'} |`,
              `| context_precision | ${r.context_precision?.toFixed(3)} | ${process.env.CONTEXT_PRECISION_THRESHOLD} | ${r.context_precision_pass ? '✅' : '❌'} |`,
              `| context_recall | ${r.context_recall?.toFixed(3)} | ${process.env.CONTEXT_RECALL_THRESHOLD} | ${r.context_recall_pass ? '✅' : '❌'} |`,
              `| source_diversity | ${r.diversity_violations} violations | 0 | ${r.diversity_violations === 0 ? '✅' : '❌'} |`,
              '',
              `Run: ${r.questions_total} questions, ${r.questions_failed} failed to answer.`,
            ].join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
