name: Eval Gate (RAGAS Faithfulness + Context Metrics)

# Blocks merge / deploy when faithfulness, context precision, or context recall
# on the golden disciple set regress below the threshold. Runs on PRs touching
# backend RAG code and as a nightly canary on main.

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/eval-gate.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/eval-gate.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  FAITHFULNESS_THRESHOLD: '0.88'
  ANSWER_RELEVANCY_THRESHOLD: '0.80'
  CONTEXT_PRECISION_THRESHOLD: '0.72'
  CONTEXT_RECALL_THRESHOLD: '0.72'
  DIVERSITY_MIN_DISTINCT_SOURCES: '2'

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Repo default workflow token permissions are read-only, and the PR-comment
    # step below calls issues.createComment (PRs are issues in the GH API) —
    # without this, that step 403s on every PR run and fails the job even when
    # the eval itself passed. Matches the pattern in backup-drill-reminder.yml.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install eval deps
        run: |
          pip install ragas==0.2.6 datasets pandas httpx pydantic pytest

      - name: Run offline PR eval suite (T2-01)
        # Runs on every PR in-process without live secrets (routing, distress benign/crisis, quote integrity, voice lint)
        run: |
          cd backend && PYTHONPATH=. pytest --noconftest tests/test_offline_pr_suite.py -v --tb=short

      - name: Check live evaluation target
        id: target
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          if [ -n "$BACKEND_URL" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "### RAGAS Eval Gate not run" >> "$GITHUB_STEP_SUMMARY"
            echo "No BACKEND_URL secret is configured. This PR received no live quality proof." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run golden eval
        if: steps.target.outputs.available == 'true'
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          BACKEND_TOKEN: ${{ secrets.BACKEND_TOKEN }}
        run: |
          python backend/evaluation/run_golden_eval.py \
            --dataset backend/evaluation/golden_dataset.json \
            --out eval_report.json \
            --faithfulness-min "$FAITHFULNESS_THRESHOLD" \
            --relevancy-min "$ANSWER_RELEVANCY_THRESHOLD" \
            --context-precision-min "$CONTEXT_PRECISION_THRESHOLD" \
            --context-recall-min "$CONTEXT_RECALL_THRESHOLD" \
            --min-distinct-sources "$DIVERSITY_MIN_DISTINCT_SOURCES"

      - name: Run deterministic clean simulation fallback
        if: steps.target.outputs.available != 'true'
        # Documented Fallback Execution:
        # When BACKEND_URL is not configured (e.g. PR runs without live deployment secrets),
        # execute the targeted clean Docker simulation suite (test_clean_docker_sim.py).
        # This provides active, deterministic quality gating across the 5 representative
        # benchmark queries (crisis preemption, authority parsing, fail-closed retrieval-only,
        # valid clip serving, and guru co-identity).
        run: |
          echo "Executing documented fallback evaluation: offline deterministic clean Docker simulation suite..."
          cd backend && PYTHONPATH=. pytest --noconftest tests/test_clean_docker_sim.py -v --tb=short
          echo "### 🛡️ Clean Simulation Fallback Passed" >> "$GITHUB_STEP_SUMMARY"
          echo "No \`BACKEND_URL\` secret was configured for live RAGAS eval. Fallback execution ran \`test_clean_docker_sim.py\` and verified all 5 representative benchmark queries deterministically." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always() && steps.target.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval_report.json
          if-no-files-found: ignore

      - name: Write results to job summary
        if: steps.target.outputs.available == 'true' && always()
        run: |
          if [ ! -f eval_report.json ]; then
            echo "### 🪷 RAGAS Eval Gate — no report produced" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "⚠️ Evaluation did not produce \`eval_report.json\`. Ensure \`BACKEND_URL\` is configured and reachable." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          r = json.load(open("eval_report.json"))
          def mark(p): return "✅" if p else "❌"
          def fmt(v):
              if v is None: return "N/A"
              try: return f"{float(v):.3f}"
              except Exception: return str(v)

          lines = [
              "### 🪷 RAGAS Eval Gate",
              "",
              f"**Scoring Method:** `{r.get('scoring_method', 'unknown')}`",
              "",
              "| metric | value | threshold | pass |",
              "|---|---|---|---|",
              f"| faithfulness | {fmt(r.get('faithfulness'))} | {os.environ.get('FAITHFULNESS_THRESHOLD', '')} | {mark(r.get('faithfulness_pass'))} |",
              f"| answer_relevancy | {fmt(r.get('answer_relevancy'))} | {os.environ.get('ANSWER_RELEVANCY_THRESHOLD', '')} | {mark(r.get('relevancy_pass'))} |",
              f"| context_precision | {fmt(r.get('context_precision'))} | {os.environ.get('CONTEXT_PRECISION_THRESHOLD', '')} | {mark(r.get('context_precision_pass'))} |",
              f"| context_recall | {fmt(r.get('context_recall'))} | {os.environ.get('CONTEXT_RECALL_THRESHOLD', '')} | {mark(r.get('context_recall_pass'))} |",
              f"| source_diversity | {r.get('diversity_violations', 0)} violations | 0 | {mark(r.get('diversity_violations') == 0)} |",
              "",
              f"Run: {r.get('questions_total', 0)} questions, {r.get('questions_failed', 0)} failed to answer.",
          ]
          if r.get("note"):
              lines.extend(["", f"> ℹ️ **Note:** {r.get('note')}"])
          print("\n".join(lines))
          PY
        env:
          FAITHFULNESS_THRESHOLD: ${{ env.FAITHFULNESS_THRESHOLD }}
          ANSWER_RELEVANCY_THRESHOLD: ${{ env.ANSWER_RELEVANCY_THRESHOLD }}
          CONTEXT_PRECISION_THRESHOLD: ${{ env.CONTEXT_PRECISION_THRESHOLD }}
          CONTEXT_RECALL_THRESHOLD: ${{ env.CONTEXT_RECALL_THRESHOLD }}

      - name: Comment summary on PR
        if: github.event_name == 'pull_request' && steps.target.outputs.available == 'true' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('eval_report.json')) return;
            const r = JSON.parse(fs.readFileSync('eval_report.json', 'utf8'));
            const fmt = (v) => (v != null && !isNaN(v)) ? Number(v).toFixed(3) : 'N/A';
            const body = [
              '### 🪷 RAGAS Eval Gate',
              '',
              `**Scoring Method:** \`${r.scoring_method || 'unknown'}\``,
              '',
              `| metric | value | threshold | pass |`,
              `|---|---|---|---|`,
              `| faithfulness | ${fmt(r.faithfulness)} | ${process.env.FAITHFULNESS_THRESHOLD} | ${r.faithfulness_pass ? '✅' : '❌'} |`,
              `| answer_relevancy | ${fmt(r.answer_relevancy)} | ${process.env.ANSWER_RELEVANCY_THRESHOLD} | ${r.relevancy_pass ? '✅' : '❌'} |`,
              `| context_precision | ${fmt(r.context_precision)} | ${process.env.CONTEXT_PRECISION_THRESHOLD} | ${r.context_precision_pass ? '✅' : '❌'} |`,
              `| context_recall | ${fmt(r.context_recall)} | ${process.env.CONTEXT_RECALL_THRESHOLD} | ${r.context_recall_pass ? '✅' : '❌'} |`,
              `| source_diversity | ${r.diversity_violations ?? 0} violations | 0 | ${r.diversity_violations === 0 ? '✅' : '❌'} |`,
              '',
              `Run: ${r.questions_total ?? 0} questions, ${r.questions_failed ?? 0} failed to answer.`,
              ...(r.note ? ['', `> ℹ️ **Note:** ${r.note}`] : [])
            ].join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
