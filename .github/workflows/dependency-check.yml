# ============================================================
# Mukthi Guru — Dependency Vulnerability Check
# Runs npm audit (frontend), pip-audit (backend), trivy fs weekly.
# ============================================================

name: Dependency Check

on:
  schedule:
    # Every Monday at 03:00 UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'backend/requirements.lock'
      - 'backend/requirements.txt'
      - 'backend/pyproject.toml'
      - 'LICENSE-EXCEPTIONS.md'
      - '.github/workflows/dependency-check.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  frontend-audit:
    name: Frontend npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        # No-fix advisories go here, never into silence: each entry needs the
        # GHSA id, why no bump can clear it, and the shared expiry. Mirrors
        # the pip-audit ignore pattern (NPM_AUDIT_ALLOW_EXPIRES).
        #   GHSA-vfj7-8cjw-p6xm  braces <=3.0.3 (build-time glob DoS only, via
        #     tailwindcss 3 chain; 3.0.3 is the latest published 3.x — no fix
        #     exists short of the tailwind v4 migration).
        #   GHSA-rj75-hqrm-r3gf  postcss-selector-parser <7.1.6 (build-time CSS
        #     parse cost; v7 arrives only via breaking tailwind v4 migration).
        # Both are reachable only by feeding malicious input to our own build,
        # never by a seeker at runtime. KaTeX (GHSA-238p-pmpm-9mq7) is NOT
        # here: fixed by the root overrides pin (>=0.18.2).
        env:
          NPM_AUDIT_ALLOW_EXPIRES: '2026-11-30'
          NPM_AUDIT_ALLOWLIST: 'GHSA-vfj7-8cjw-p6xm,GHSA-rj75-hqrm-r3gf'
        run: |
          if [ "$(date -u +%F)" \> "$NPM_AUDIT_ALLOW_EXPIRES" ]; then
            echo "npm-audit allowlist expired on $NPM_AUDIT_ALLOW_EXPIRES: re-check for fixed releases and renew or remove." >&2
            exit 1
          fi
          # No `|| true`: npm exits non-zero both for findings and for
          # command/registry errors. The parser below fails unless the report
          # parses AND carries vulnerability data, so a registry outage or a
          # crashed audit can never look like a clean tree.
          set +e
          npm audit --audit-level=moderate --json > npm-audit-report.json
          audit_exit=$?
          set -e
          NPM_AUDIT_EXIT=$audit_exit node -e "
          const fs = require('fs');
          let r;
          try {
            r = JSON.parse(fs.readFileSync('npm-audit-report.json', 'utf8'));
          } catch (e) {
            console.error('npm audit produced no parseable report (exit ' + process.env.NPM_AUDIT_EXIT + '): ' + e.message);
            process.exit(1);
          }
          if (!r || typeof r !== 'object' || !r.vulnerabilities || typeof r.vulnerabilities !== 'object') {
            console.error('npm audit report has no vulnerability data (exit ' + process.env.NPM_AUDIT_EXIT + '); refusing to treat as clean.');
            process.exit(1);
          }
          const allow = new Set((process.env.NPM_AUDIT_ALLOWLIST || '').split(',').map(s => s.trim().toUpperCase()).filter(Boolean));
          const rank = { info: 0, low: 1, moderate: 2, high: 3, critical: 4 };
          const found = new Map();
          for (const v of Object.values(r.vulnerabilities)) {
            for (const via of (v.via || [])) {
              if (typeof via === 'string') continue;
              const m = (via.url || '').match(/GHSA-[a-z0-9-]+/i);
              const ghsa = m ? m[0].toUpperCase() : ('NO-GHSA-URL:' + (via.name || v.name || '?'));
              const sev = String(via.severity || v.severity || 'info').toLowerCase();
              const prev = found.get(ghsa);
              if (!prev || (rank[sev] || 0) > (rank[prev.sev] || 0)) found.set(ghsa, { sev, title: (via.title || '').slice(0, 80) });
            }
          }
          // Only moderate-or-higher unallowlisted advisories block: lows and
          // infos are reported, never gate-failing (matches --audit-level).
          const blocking = [...found.entries()].filter(([g, f]) => (rank[f.sev] || 0) >= rank.moderate && ![...allow].some(x => g.includes(x)));
          for (const [g, f] of found.entries()) {
            if ((rank[f.sev] || 0) < rank.moderate) console.log('note (below gate): ' + g + ' [' + f.sev + '] ' + f.title);
          }
          if (blocking.length) { console.error('Blocking npm advisories:'); for (const [g, f] of blocking) console.error(' - ' + g + ' [' + f.sev + '] ' + f.title); process.exit(1); }
          console.log('npm audit: only allowlisted advisories present (' + [...allow].join(', ') + ').');
          "
        # Fail CI on moderate or higher findings outside the allowlist

  backend-audit:
    name: Backend pip-audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.lock

      - name: Install pip-audit
        run: pip install pip-audit

      # P1-OPS-2: failure-swallowing removed — a finding must fail the job.
      # The ONLY exceptions are advisories with NO published fixed release
      # (checked 2026-10-09 with pip-audit: empty fix_versions), approved by
      # Harsha as "Allow with expiry". Each expires on PIP_AUDIT_IGNORE_EXPIRES
      # (30 days); the first step below fails the job after that date.
      #   PYSEC-2026-2447  diskcache 5.6.3      (via dspy)  no fix
      #   PYSEC-2026-3468  gptcache 0.1.44      (direct)    no fix
      #   PYSEC-2025-217   transformers 4.57.6  (pinned)    no fix
      #   PYSEC-2026-4174  transformers 4.57.6  (pinned)    no fix
      # DEVIATION (2026-10-14, agent, needs owner eyes): PYSEC-2026-2270
      # (python-dotenv 1.0.1, local symlink overwrite) HAS a fix (1.2.2) but
      # the resolver cannot take it: lettucedetect->rag-fact-checker hard-pins
      # dotenv==1.0.1, and llm-guard 0.3.16 (the only newer option) pins
      # transformers==4.51.3, a downgrade from the validated 5.19.0.
      # Dropping LettuceDetect instead would remove the default-on NLI
      # faithfulness gate (lettucedetect_enabled=True) — the worse trade.
      # Same expiry; re-check the pin chain then, or accept the local-only
      # risk permanently with a policy note.
      # NOT ignored (fix exists but needs a major bump or breaks the lock; see
      # lessons.md L-DEPS-SECURITY-1): litellm, pytest, sentence-transformers,
      # python-dotenv, transformers 5.x.
      - name: Check pip-audit ignore-list expiry
        env:
          PIP_AUDIT_IGNORE_EXPIRES: '2026-11-08'
        run: |
          if [ "$(date -u +%F)" \> "$PIP_AUDIT_IGNORE_EXPIRES" ]; then
            echo "pip-audit ignore list expired on $PIP_AUDIT_IGNORE_EXPIRES: re-check for fixed releases and renew or remove." >&2
            exit 1
          fi

      - name: Run pip-audit on requirements.lock (JSON report, blocking)
        run: >
          pip-audit -r requirements.lock --desc --format=json -o pip-audit-report.json
          --ignore-vuln PYSEC-2026-2447 --ignore-vuln PYSEC-2026-3468
          --ignore-vuln PYSEC-2025-217 --ignore-vuln PYSEC-2026-4174
          --ignore-vuln PYSEC-2026-2270

      - name: Run pip-audit on requirements.lock (strict)
        run: >
          pip-audit -r requirements.lock --desc
          --ignore-vuln PYSEC-2026-2447 --ignore-vuln PYSEC-2026-3468
          --ignore-vuln PYSEC-2025-217 --ignore-vuln PYSEC-2026-4174
          --ignore-vuln PYSEC-2026-2270
        # Fail CI on any other finding

      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: backend/pip-audit-report.json
          retention-days: 30

  license-compliance:
    name: License compliance (fail on copyleft)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.lock

      - name: Install frontend dependencies
        run: npm ci

      # Step 28: JS gate. Fails the build on strong-copyleft licenses
      # (GPL/AGPL/LGPL/CDDL/EPL/EUPL/OSL). MPL-2.0 is NOT in the fail
      # list — it is audited against LICENSE-EXCEPTIONS.md by the
      # warn-only step below so the two approved dev-only axe exceptions
      # (and any future triaged entries) do not break the build.
      - name: JS license gate (fail on strong copyleft)
        run: |
          npx --yes license-checker --summary | tee package-licenses-summary.txt
          test "${PIPESTATUS[0]}" -eq 0
          npx --yes license-checker --failOn 'GPL;AGPL;LGPL;CDDL;EPL;EUPL;OSL' --summary

      - name: JS MPL-2.0 cross-check vs LICENSE-EXCEPTIONS.md (warn-only)
        # Any MPL-2.0 package NOT named in LICENSE-EXCEPTIONS.md is
        # reported as a ::warning, not a failure, so the baseline stays
        # green while new MPL introductions stay visible.
        # lightningcss ships one native binary per OS/arch as separate
        # optionalDependencies (lightningcss-darwin-arm64, -linux-x64-gnu,
        # etc, per npm's platform-binary convention). Only the base package
        # is listed in LICENSE-EXCEPTIONS.md, so a package name matching
        # <base>-<os>[-<libc>]-<arch> is reduced to <base> before checking,
        # rather than needing every platform combination enumerated in the
        # markdown file (2026-09-06 fix — resolved the triage this comment
        # used to point at).
        run: |
          node -e "
          const fs = require('fs');
          const { execSync } = require('child_process');
          const data = JSON.parse(execSync('npx --yes license-checker --json', { encoding: 'utf8', stdio: ['ignore', 'pipe', 'ignore'] }));
          const exc = fs.readFileSync('LICENSE-EXCEPTIONS.md', 'utf8');
          const platformSuffix = /-(darwin|linux|win32|freebsd|android)(-\w+)?-(x64|arm64|arm|ia32)$/;
          // A disjunctive license like '(MPL-2.0 OR Apache-2.0)' already
          // satisfies the repo's Apache-2.0/MIT policy via the OR branch —
          // it needs no exception entry at all. Only flag a package whose
          // license is MPL with no compliant alternative on offer.
          const hasCompliantAlternative = (lic) => /\bOR\b/.test(lic) && /(Apache-2\.0|Apache License|MIT)/i.test(lic);
          let unlisted = [];
          for (const [spec, meta] of Object.entries(data)) {
            const lic = String(meta.licenses || '');
            if (lic.includes('MPL') && !hasCompliantAlternative(lic)) {
              const name = spec.slice(0, spec.lastIndexOf('@'));
              const baseName = name.replace(platformSuffix, '');
              if (!exc.includes(name) && !exc.includes(baseName)) unlisted.push(spec + ' [' + lic + ']');
            }
          }
          if (unlisted.length) {
            console.log('::warning::MPL-2.0 packages not in LICENSE-EXCEPTIONS.md: ' + unlisted.join(', '));
          } else {
            console.log('All MPL-2.0 packages are listed in LICENSE-EXCEPTIONS.md.');
          }
          "

      - name: Install backend dependencies + pip-licenses
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.lock
          pip install pip-licenses

      # Step 28: Python gate. --partial-match so variants like
      # 'GNU General Public License v3 (GPLv3)' still match 'GPL'.
      # MPL is intentionally NOT in the fail list (see JS comment).
      # LICENSE_ALLOWLIST names packages recorded in LICENSE-EXCEPTIONS.md
      # (runtime section); any allowlisted name NOT recorded there fails the
      # gate, so a row alone never clears it. Current: easydict (LGPL-3.0,
      # transitive via lettucedetect->rag-fact-checker, 2026-10-14).
      - name: Python license gate (fail on strong copyleft)
        working-directory: backend
        env:
          LICENSE_ALLOWLIST: 'easydict,python-bidi'
        run: |
          pip-licenses --format=json --output-file=python-licenses.json
          python3 -c "
          import json, os, re, sys
          data = json.load(open('python-licenses.json'))
          exc = open('../LICENSE-EXCEPTIONS.md').read()
          allow = {a.strip().lower() for a in os.environ.get('LICENSE_ALLOWLIST', '').split(',') if a.strip()}
          # Review 2026-10-14: exact table-cell match, not substring — a mere
          # mention of the name anywhere in the file must not clear the gate.
          cells = {m.group(1).strip().lower()
                   for m in re.finditer(r'^\|\s*`([^`]+)`\s*\|', exc, re.M)}
          undocumented = [a for a in allow if a not in cells]
          if undocumented:
              print('Allowlisted but not recorded in LICENSE-EXCEPTIONS.md: ' + ', '.join(sorted(undocumented))); sys.exit(1)
          pats = ['GPL', 'AGPL', 'LGPL', 'Affero General Public License', 'General Public License', 'Lesser General Public License', 'CDDL', 'Common Development and Distribution', 'Eclipse Public License', 'EUPL', 'European Union Public', 'OSL', 'Open Software License']
          bad = [f\"{d['Name']}@{d['Version']} [{d['License']}]\" for d in data if any(p.lower() in (d.get('License') or '').lower() for p in pats) and d['Name'].lower() not in allow]
          if bad:
              print('Copyleft packages (not allowlisted): ' + ', '.join(bad)); sys.exit(1)
          print('Python license gate passed' + (' (allowlist: %s)' % sorted(allow) if allow else ''))
          "

      - name: Python MPL cross-check vs LICENSE-EXCEPTIONS.md (warn-only)
        working-directory: backend
        run: |
          python3 -c "
          import json, subprocess
          raw = subprocess.run(['pip-licenses', '--format=json'], capture_output=True, text=True)
          raw.check_returncode()
          data = json.loads(raw.stdout or '[]')
          exc = open('../LICENSE-EXCEPTIONS.md').read()
          def _has_compliant_alt(lic):
              lic = lic or ''
              return ' or ' in lic.lower() and any(x in lic for x in ('Apache Software License', 'Apache-2.0', 'MIT'))
          unlisted = [f\"{d['Name']}@{d['Version']} [{d['License']}]\" for d in data if 'Mozilla' in (d.get('License') or '') and not _has_compliant_alt(d.get('License')) and d['Name'] not in exc]
          print('MPL-licensed Python packages not in LICENSE-EXCEPTIONS.md: ' + (', '.join(unlisted) if unlisted else '(none — all listed)'))
          "

      - name: Upload license reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: license-reports
          path: |
            package-licenses-summary.txt
            backend/python-licenses.json
          retention-days: 30
          if-no-files-found: warn

  trivy-fs:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version/severity mirror build-deploy.yml image scans (aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0,
      # HIGH,CRITICAL). Exit-code 1 here (unlike the image scans' '0') — P1-OPS-2:
      # CI security gates must block CI, never swallow findings.
      - name: Scan repository filesystem
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: HIGH,CRITICAL
          # Same as the image scans (L-TRIVY-SARIF-SEVERITY-1): without this,
          # format: sarif ignores severity and MEDIUM/secret findings fail a
          # HIGH,CRITICAL gate with an empty-looking log.
          limit-severities-for-sarif: true
          exit-code: '1'
          ignore-unfixed: true

      - name: Upload trivy fs scan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs
          path: trivy-fs.sarif
          retention-days: 30
