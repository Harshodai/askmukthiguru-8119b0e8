name: Nightly Corpus & Knowledge Audit

on:
  schedule:
    - cron: '0 3 * * *'  # 03:00 UTC every night
  workflow_dispatch:

jobs:
  audit:
    name: Run Corpus & Safety Audits
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Use the committed Python 3.12 lockfile. Floating Supabase SDK
          # constraints in requirements.txt can exceed pip's resolver-depth cap.
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r backend/requirements.lock

      - name: Run Corpus Text Quality & Artifact Forensics
        run: |
          cd backend
          python -m pytest tests/test_ingestion_pipeline.py -v
          python -m pytest tests/test_neo4j_subgraph_timeout.py -v
          python -m pytest tests/test_llm_budget_guard.py -v
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          # Same mock values as lint-test.yml: Settings refuses to load without them.
          JWT_SECRET: dummy-jwt-secret-key-for-ci-runs
          OPENROUTER_API_KEY: mock-openrouter-key-for-ci
