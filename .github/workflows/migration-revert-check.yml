# Migration rollback policy check.
# Rollback blocks are human-reviewed instructions, and per docs/runbooks/MIGRATION_ROLLBACK.md
# they must never be executed automatically. The ordered forward migration chain is exercised
# against local Supabase by .github/workflows/prelaunch-gate.yml.
name: Migration Revert Block Check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check-revert-blocks:
    name: Verify rollback contract (no automatic down migration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find changed migration files
        id: changed
        shell: bash
        run: |
          set -euo pipefail
          if git show-ref --verify --quiet refs/remotes/origin/main; then
            CHANGED=$(git diff --name-only origin/main...HEAD -- 'supabase/migrations/*.sql' || true)
          else
            echo "origin/main not available; checking all migrations as fallback." >&2
            CHANGED=$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -print | sort)
          fi
          {
            echo "changed<<EOF"
            echo "$CHANGED"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Validate rollback documentation and prohibit automatic execution
        shell: bash
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.changed }}
        run: |
          set -euo pipefail
          if [ ! -f docs/runbooks/MIGRATION_ROLLBACK.md ]; then
            echo "Missing migration rollback runbook."
            exit 1
          fi
          grep -Fq "they are never run automatically" docs/runbooks/MIGRATION_ROLLBACK.md || {
            echo "Rollback runbook must state that rollback blocks are human-reviewed and never auto-executed."
            exit 1
          }

          MISSING=""
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            [ -f "$f" ] || continue
            if ! grep -q -- "-- REVERT:" "$f"; then
              MISSING="$MISSING\n$f"
            fi
          done <<< "$CHANGED_FILES"

          if [ -n "$MISSING" ]; then
            echo -e "Missing -- REVERT: rollback section in:\n$MISSING"
            exit 1
          fi

          echo "Changed migrations have rollback documentation; manual rollback SQL is not auto-executed."
          echo "Forward migration-chain validation is owned by .github/workflows/prelaunch-gate.yml (local Supabase)."
