name: Staging Security Verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-security-verification
  cancel-in-progress: false

jobs:
  verify-staging:
    name: Staging runtime, RLS, migration, and retrieval gates
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 45
    env:
      STAGING_ENVIRONMENT: staging
      ALLOW_NONDESTRUCTIVE_DB_VERIFY: '1'
      ALLOW_STAGING_SYNTHETIC_USERS: '1'
      STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
      STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      QDRANT_URL: ${{ secrets.QDRANT_URL }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      QDRANT_COLLECTION: ${{ secrets.QDRANT_COLLECTION }}
      EVIDENCE_DIR: staging-evidence/${{ github.run_id }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install verification dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Verify migration transaction and rollback safety
        run: bash scripts/ops/verify_migration_rollback.sh

      - name: Run staging red-team and synthetic-user RLS checks
        run: bash scripts/ops/staging_red_team.sh

      - name: Run strict read-only retrieval gate
        run: bash scripts/ops/verify_retrieval_gate.sh

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-security-evidence-${{ github.run_id }}
          path: staging-evidence/${{ github.run_id }}/
          if-no-files-found: warn
          retention-days: 14
