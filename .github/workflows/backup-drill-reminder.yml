# ============================================================
# Mukthi Guru — Monthly Backup/Restore Drill Reminder
# Opens exactly one GitHub issue per calendar month.
# ============================================================

name: Monthly Backup Restore Drill Reminder

concurrency:
  group: monthly-backup-restore-drill
  cancel-in-progress: false

on:
  # Cron day-of-month/day-of-week fields are ORed by standard cron.
  # Run each Monday, then enforce "first Monday" in the script below.
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  create-drill-issue:
    name: Create monthly backup/restore drill issue
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Test monthly reminder logic
        run: node --test .github/scripts/monthly_backup_reminder.test.js

      - name: Open monthly drill issue once
        uses: actions/github-script@v7
        env:
          ISSUE_BODY: |
            ## Monthly Backup/Restore Drill

            Run the procedure in [docs/runbooks/BACKUP_RESTORE_DRILL.md](../blob/main/docs/runbooks/BACKUP_RESTORE_DRILL.md) and post the result log as a comment below.

            ### Checklist
            - [ ] Local Postgres schema/data backup and isolated restore, or mark NOT COVERED
            - [ ] Hosted Supabase roles/schema/data artifact and isolated restore, or mark NOT COVERED
            - [ ] Qdrant snapshots for each active collection and isolated restore
            - [ ] Memgraph dump/checksum and isolated graph restore
            - [ ] Redis RDB/checksum and isolated Redis restore
            - [ ] Railway Qdrant/Memgraph/Redis off-host backup coverage verified, or mark NOT COVERED
            - [ ] Smoke tests pass against the isolated restored stack
            - [ ] Backup freshness and off-host copy verified
            - [ ] Evidence log appended to this issue

            ### Required evidence
            For every store, record the artifact path, byte size, SHA-256, backup timestamp, restore target, and before/after counts. A missing backup or an unverified restore must be recorded as NOT COVERED / FAIL, never PASS.

            ### Notes
            - Use an isolated non-production restore target; never overwrite the source service.
            - The hosted Supabase workflow is expected to fail while the repository is public because its database artifact privacy gate is fail-closed. Do not weaken that gate to make the workflow green.
            - Redis RDB export currently has no scheduled job; manually run the documented utility and report the scheduling gap.
            - If any required restore fails, file a P1 incident issue and do not close this issue until re-run passes.
        with:
          script: |
            const {
              monthKey,
              isFirstMondayUtc,
              findExistingMonthlyIssue,
            } = require('./.github/scripts/monthly_backup_reminder');
            const now = new Date();
            const targetMonth = monthKey(now);

            if (context.eventName === 'schedule' && !isFirstMondayUtc(now)) {
              core.notice(`Not the first Monday of ${targetMonth}; no issue created.`);
              return;
            }

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100,
            });
            const existing = findExistingMonthlyIssue(issues, now);

            if (existing) {
              core.notice(`Monthly drill already tracked by #${existing.number} (${existing.state}); no duplicate created.`);
              return;
            }

            const title = `[OPS] Monthly backup/restore drill — ${targetMonth}`;
            const labels = ['ops', 'backup', 'drill'];
            const created = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: process.env.ISSUE_BODY,
              labels,
            });
            core.notice(`Created monthly backup/restore drill #${created.data.number} for ${targetMonth}.`);
