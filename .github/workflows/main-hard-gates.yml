name: Main Hard Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build, lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  backend-static:
    name: Backend syntax and repository guards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python sources
        run: python -m compileall -q backend
      - name: Git diff cleanliness
        run: git diff --check
      - name: Reject obvious committed secret material
        run: python scripts/security_audit.py --report

  repository-production-contract:
    name: Repository production contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate required source contracts
        run: |
          set -euo pipefail
          test -f backend/app/config.py
          test -f backend/app/chat_uploads.py
          test -f backend/tests/test_qdrant_search_quality.py
          test -f backend/tests/redteam_harness.py
          test -f backend/app/runtime_artifacts.py
          test -f backend/tests/test_runtime_artifacts.py
          test -f docs/production/PRODUCTION_READINESS.md
          # NOTE: the `test -f` lines above prove these files EXIST. They do not
          # run anything. In particular the retrieval-quality suite is not
          # executed by this workflow — it needs a live Qdrant. Do not read a
          # green run here as evidence of retrieval quality.
          #
          # What IS enforceable without services: the quality gate's baseline
          # must be able to discriminate. It was checked in as mean_ndcg 0.0,
          # which turns the regression assertion into `>= -0.02` — vacuously
          # true even during a total retrieval outage. A gate that cannot fail
          # is worse than no gate, so fail the build on a degenerate baseline.
          python - <<'PY'
          import json, pathlib, sys
          p = pathlib.Path("memory/qdrant_quality_baseline.json")
          if not p.exists():
              print(f"::warning::{p} missing; retrieval-quality gate has no baseline")
              sys.exit(0)
          ndcg = json.loads(p.read_text()).get("hybrid", {}).get("mean_ndcg", 0.0)
          if ndcg <= 0.0:
              print(
                  f"::error::retrieval-quality baseline mean_ndcg={ndcg} is degenerate. "
                  "The regression assertion becomes vacuously true. Re-record against a "
                  "populated collection with UPDATE_QDRANT_BASELINE=1."
              )
              sys.exit(1)
          print(f"retrieval-quality baseline is discriminating: mean_ndcg={ndcg}")
          PY
          PYTHONPATH=backend python - <<'PY'
          from app.runtime_artifacts import inspect_runtime_artifacts
          result = inspect_runtime_artifacts()
          print(result)
          assert result['total'] == 3
          PY
          if grep -R --line-number --exclude-dir=.git --exclude='*.md' -E 'memory/okf/compiled\\.json|data/doctrine_lexicon\\.json' backend scripts supabase 2>/dev/null | grep -v 'FileNotFoundError' >/tmp/runtime-artifact-refs.txt; then
            echo 'Runtime artifact references detected:'
            cat /tmp/runtime-artifact-refs.txt
          fi

  load-evidence-policy:
    name: Load-test evidence policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Ensure nightly load workflow cannot silently pass as a release gate
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/nightly-load.yml')
          text = p.read_text()
          assert 'ALLOW_UNREACHABLE_SUCCESS' in text, 'Nightly load evidence policy marker missing'
          assert 'exit 1' in text, 'Nightly load workflow must contain a hard failure path'
          assert 'NO_BACKEND_EVIDENCE' in text, 'Missing no-evidence marker'
          assert "if: steps.reachable.outputs.reachable == 'true'" in text, 'Load jobs must be conditioned on a proven reachable backend'
          print('Load-test evidence policy present.')
          PY
