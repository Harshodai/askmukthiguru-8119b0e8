name: Main Hard Gates

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build, lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Pin npm to the repository package manager version
        run: npm install --global npm@10.9.8
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  backend-static:
    name: Backend syntax and repository guards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python sources
        run: python -m compileall -q backend
      - name: Git diff cleanliness
        run: git diff --check
      - name: Reject obvious committed secret material
        run: python scripts/security_audit.py --report

  repository-production-contract:
    name: Repository production contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight contract test dependencies
        run: |
          pip install pytest pytest-asyncio pydantic pydantic-settings pyyaml numpy python-dotenv qdrant-client==1.20.0 fastapi==0.142.2
      - name: Validate required source contracts and execute active test suites
        run: |
          set -euo pipefail
          test -f backend/app/config.py
          test -f backend/app/chat_uploads.py
          test -f docs/production/PRODUCTION_READINESS.md

          # Active execution steps replacing passive existence checks:
          # The global backend conftest starts the full application test harness
          # and imports SlowAPI/Supabase/Redis/service dependencies. This job is
          # intentionally the small, service-free contract suite, so disable it
          # and provide the settings needed by these isolated tests explicitly.
          export PYTHONPATH=backend
          export IS_PRODUCTION=false
          export JWT_SECRET=dummy-jwt-secret-for-contract-tests
          export ANON_SESSION_HMAC_SECRET=dummy-anon-hmac-for-contract-tests
          export OPENROUTER_API_KEY=dummy-openrouter-key-for-contract-tests
          export SARVAM_API_KEY=dummy-sarvam-key-for-contract-tests
          export SUPABASE_URL=https://example.supabase.co
          export SUPABASE_KEY=dummy-supabase-key-for-contract-tests
          export REDIS_URL=redis://localhost:6379/15
          export QDRANT_URL=http://localhost:6333
          export NEO4J_URI=bolt://localhost:7687
          export NEO4J_PASSWORD=dummy-graph-password-for-contract-tests

          pytest --noconftest backend/tests/test_repo_layout.py -v
          pytest --noconftest backend/tests/test_first_person_serving_contract.py \
            -k "not pipeline and not test_a_test_double_store and not test_digest_changes_when_configured_contract_changes and not test_unset_path_falls_back_to_the_default_contract" -v

          # These focused modules are service-free fakes. Never run the full
          # application conftest in this job; it belongs to the comprehensive
          # backend suite in lint-test.yml.
          pytest --noconftest backend/tests/test_guru_kg_governance.py -v
          pytest --noconftest backend/tests/test_video_composition.py -v
          pytest --noconftest backend/tests/test_kg_expansion_async_resolution.py -v
          pytest --noconftest backend/tests/test_speaker_verification_policy.py -v
          if [ -f backend/tests/test_p0_remediation.py ]; then
            PYTHONPATH=backend pytest backend/tests/test_p0_remediation.py -v
          else
            echo "::warning::backend/tests/test_p0_remediation.py not yet present"
          fi
          # NOTE: the `test -f` lines above prove these files EXIST. They do not
          # run anything. In particular the retrieval-quality suite is not
          # executed by this workflow — it needs a live Qdrant. Do not read a
          # green run here as evidence of retrieval quality.
          #
          # What IS enforceable without services: the quality gate's baseline
          # must be able to discriminate. It was checked in as mean_ndcg 0.0,
          # which turns the regression assertion into `>= -0.02` — vacuously
          # true even during a total retrieval outage. A gate that cannot fail
          # is worse than no gate, so fail the build on a degenerate baseline.
          python - <<'PY'
          import json, pathlib, sys
          p = pathlib.Path("memory/qdrant_quality_baseline.json")
          if not p.exists():
              print(f"::warning::{p} missing; retrieval-quality gate has no baseline")
              sys.exit(0)
          ndcg = json.loads(p.read_text()).get("hybrid", {}).get("mean_ndcg", 0.0)
          if ndcg <= 0.0:
              print(
                  f"::error::retrieval-quality baseline mean_ndcg={ndcg} is degenerate. "
                  "The regression assertion becomes vacuously true. Re-record against a "
                  "populated collection with UPDATE_QDRANT_BASELINE=1."
              )
              sys.exit(1)
          print(f"retrieval-quality baseline is discriminating: mean_ndcg={ndcg}")
          PY
          PYTHONPATH=backend python - <<'PY'
          from app.runtime_artifacts import inspect_runtime_artifacts
          result = inspect_runtime_artifacts()
          print(result)
          assert result['total'] == 3
          PY
          if grep -R --line-number --exclude-dir=.git --exclude='*.md' -E 'memory/okf/compiled\\.json|data/doctrine_lexicon\\.json' backend scripts supabase 2>/dev/null | grep -v 'FileNotFoundError' >/tmp/runtime-artifact-refs.txt; then
            echo 'Runtime artifact references detected:'
            cat /tmp/runtime-artifact-refs.txt
          fi

  load-evidence-policy:
    name: Load-test evidence policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Ensure nightly load workflow cannot silently pass as a release gate
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/nightly-load.yml')
          text = p.read_text()
          assert 'ALLOW_UNREACHABLE_SUCCESS' in text, 'Nightly load evidence policy marker missing'
          assert 'exit 1' in text, 'Nightly load workflow must contain a hard failure path'
          assert 'NO_BACKEND_EVIDENCE' in text, 'Missing no-evidence marker'
          assert "if: steps.reachable.outputs.reachable == 'true'" in text, 'Load jobs must be conditioned on a proven reachable backend'
          print('Load-test evidence policy present.')
          PY
