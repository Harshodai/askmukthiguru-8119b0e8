name: Production Readiness

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feat/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and integration tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Bundle budget
        run: npm run bundle:check

      - name: Mobile build
        run: npm run build:mobile

  backend:
    name: Backend regression gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.lock

      - name: Pytest
        working-directory: backend
        # faulthandler_timeout dumps every thread's stack if a single test runs
        # past 5 min, so a stall (seen ~24% in, cancelled at 45 min) names the
        # hung test instead of just timing out; --durations lists the slowest.
        run: |
          ulimit -a
          free -m
          python -m pytest -q -o faulthandler_timeout=300 --durations=25
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          JWT_SECRET: dummy-jwt-secret-key-for-ci-runs
          OPENROUTER_API_KEY: mock-openrouter-key-for-ci
          # Cap glibc per-thread malloc arenas (same setting the images use).
          # Each arena reserves 64 MB of VIRTUAL space; uncapped, a pytest run
          # that touches torch/onnx threads piles up reservations. L-CI-RLIMIT-1.
          MALLOC_ARENA_MAX: "2"
