# ============================================================
# Mukthi Guru — Lint & Test Workflow
# Runs on every PR and push to main. Both frontend and backend
# must pass before merge.
# ============================================================

name: Lint & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # --- Frontend ---
  frontend-lint-test:
    name: Frontend Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check metrics schema parity (P1-AI-24)
        # backend/app/schemas/metrics.py (pydantic UserMetrics) and
        # src/lib/metricsSchema.ts (zod) must stay 1:1 in field keys.
        # Fails on any drift so a backend metrics addition can never
        # silently desync the frontend consumer.
        run: node scripts/check_metrics_schema_parity.mjs

      - name: Check i18n locale coverage (P1-FE-11)
        # Every real locale file must expose the same leaf translation keys
        # as en.json (source of truth). Missing nested keys silently fall back
        # to English, so this deep-parity gate prevents untranslated UI scope creep.
        run: node scripts/check_i18n_coverage.mjs

      - name: Check i18n translation quality (P1-FE-12)
        # Key parity alone cannot detect corrupted values or placeholder drift.
        # Keep the locale bundles semantically sane at the data-contract level.
        run: node scripts/check_i18n_quality.mjs

      - name: Build frontend
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://mock-supabase.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: mock-anon-key-for-ci-build

      - name: Check bundle budget
        run: npm run bundle:check

      # Keep this after the production budget gate: both builds write dist/,
      # while the budget is defined for the production web artifact.
      - name: Build mobile frontend
        run: npm run build:mobile
        env:
          VITE_SUPABASE_URL: https://mock-supabase.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: mock-anon-key-for-ci-build

      - name: Run Vitest tests
        run: npm test

  # --- Backend ---
  backend-lint-test:
    name: Backend Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.lock

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.lock
          # Pinned exact (not "ruff bandit" floating) — an unpinned linter/
          # scanner means CI's pass/fail verdict silently shifts with
          # whatever version PyPI resolves on a given day, independent of any
          # code change. Versions match what pyproject's dev dependency group
          # installs locally (verified 2026-09-16), so a local `ruff check .`
          # and this step agree.
          pip install ruff==0.15.13 bandit==1.9.4 mypy==2.1.0 pytest-cov==7.1.0

      - name: Run Ruff linter
        run: ruff check . --output-format=github

      - name: Run Ruff formatter check
        run: ruff format --check .

      - name: Run Bandit security scan
        # AUDIT FIX 2026-08-01: removed '|| true' — bandit must block CI on
        # medium+ severity findings. Add known false positives to .bandit instead
        # of suppressing the entire scanner.
        # Pass explicit directories matching Makefile quality target (avoids scanning third-party packages or one-off scripts).
        run: bandit -r app rag services routers domain ingest schemas tasks --severity-level medium --confidence-level medium --quiet --ini .bandit

      - name: Forbid JWT_SECRET benchmark backdoor (CRIT-1)
        # A leaked JWT_SECRET (the HS256 token-signing secret) must never unlock
        # the benchmark X-Test-Key bypass. Runs from the repo root (this job's
        # working-directory is backend/) so root-level benchmark scripts such as
        # scripts/benchmarks/load_test.py are scanned too.
        # AST-based scanner (scripts/security/check_benchmark_backdoor.py):
        #   - catches the historical MULTI-LINE backdoor form where X-Test-Key
        #     and jwt_secret sit on separate lines (a same-line grep cannot see
        #     it) by flagging any function that references both tokens
        #   - ignores comments/docstrings, so the guard's own docstring and the
        #     regression-test file (test_no_jwt_secret_backdoor.py, which
        #     intentionally sends JWT_SECRET as X-Test-Key to ASSERT rejection)
        #     do not false-positive
        # Fail-closed: the scanner exits 1 on any coupling or scan error;
        # GitHub's default bash (-e) turns a non-zero exit into a step failure,
        # so a broken scan can never silently pass.
        working-directory: .
        run: python3 scripts/security/check_benchmark_backdoor.py

      - name: Run pytest (coverage floor + mypy ratchet run as part of the suite)
        # Coverage floor (pyproject [tool.coverage.report] fail_under) and the
        # mypy error-count ratchet (tests/test_type_check_baseline.py) are
        # both plain pytest tests/config, not separate steps — one command
        # gives the same verdict here and in `make quality` locally.
        run: >
          pytest tests/ -v --tb=short
          --cov=app --cov=rag --cov=domain --cov=services --cov=routers
          --cov=ingest --cov=schemas --cov=tasks --cov-report=term
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          JWT_SECRET: dummy-jwt-secret-key-for-ci-runs
          OPENROUTER_API_KEY: mock-openrouter-key-for-ci

      - name: Run tier-3 safety scenario harness (PLAN.md Phase B5)
        # evals/run_safety_scenarios.py drives the real, deterministic
        # crisis-preemption code path (SereneMindEngine.assess_distress ->
        # DistressStage._crisis_preemption_result) against every tier-3
        # scenario under evals/scenarios/tier3_crisis/ — no LLM call, no live
        # backend, so it's safe and fast to run on every PR. This is the CI
        # gate that would have caught L-CRISIS-REGEX-GAP-1
        # ("I want to end my life" returning DistressLevel.NONE) before it
        # ever shipped, had it existed sooner — added specifically so that
        # class of regression can't recur silently. Exits non-zero on any
        # scenario failing its mechanical checks (helpline missing, method
        # info leaked, no direct safety question); see evals/README.md for
        # exactly what this does and does NOT verify (no cultural_fit/
        # no_false_reassurance judgment — that needs a human).
        working-directory: .
        run: python3 evals/run_safety_scenarios.py
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          JWT_SECRET: dummy-jwt-secret-key-for-ci-runs
          OPENROUTER_API_KEY: mock-openrouter-key-for-ci

      - name: Run grounding checker self-check (PLAN.md Phase B2)
        # evals/grounding/verify_quote.py checks verbatim-quote and
        # attribution claims against the real transcripts/*.md corpus (no
        # live backend needed). Its __main__ self-check proves the checker
        # itself is correct (true/false positives, fail-closed on a missing
        # source) — it does not yet check real system-generated citations,
        # which needs a live backend this environment doesn't have.
        working-directory: .
        run: python3 evals/grounding/verify_quote.py

  # --- Pre-commit validation ---
  pre-commit-check:
    name: Validate Pre-commit Hooks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.lock

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install pre-commit
        run: pip install pre-commit

      - name: INV-6 — no PII dumps in working tree (CRIT-6)
        # Belt-and-suspenders alongside the pre-commit local hook: even if a
        # contributor bypasses local hooks (--no-verify), CI still fails if a
        # known PII dump filename (neo4j.dump / supabase_dump.sql /
        # redis_dump.rdb / cookies.txt / public_schema_dump.sql) is present
        # in the checkout. Detector: scripts/security/check_no_pii_dumps.sh
        # (never deletes; only detects). Cleanup runbook:
        # docs/runbooks/SECRET_ROTATION.md.
        working-directory: .
        run: bash scripts/security/verify_no_pii_dumps.sh .

      - name: Install backend deps (for hooks)
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.lock

      - name: Install frontend deps (for eslint hook)
        run: npm ci

      - name: Run pre-commit on changed files
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            mapfile -d '' files < <(git diff --name-only -z "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}")
          else
            mapfile -d '' files < <(git diff-tree --no-commit-id --name-only -r -z HEAD)
          fi
          if ((${#files[@]} == 0)); then
            echo "No changed files require pre-commit validation."
            exit 0
          fi
          printf 'Validating %d changed file(s)\n' "${#files[@]}"
          pre-commit run --files "${files[@]}" --show-diff-on-failure
