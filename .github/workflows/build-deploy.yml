# ============================================================
# Mukthi Guru — Build & Deploy Workflow
# Builds backend and frontend Docker images and pushes to GHCR.
# Triggered on push to main after lint-test passes.
# ============================================================

name: Build & Deploy

on:
  workflow_run:
    workflows: ["Lint & Test"]
    branches: [main]
    types: [completed]
  # Manual trigger for hot-fixes or re-runs
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/frontend

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    # Job-level secret mapping (review 2026-10-14): steps reference env,
    # never secrets.* directly, so the deployable-latest gate below reads
    # two plain values. Empty until the secrets exist (then no latest).
    env:
      DEPLOY_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      DEPLOY_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract backend metadata
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Get first image tag for scanning
        id: backend-tag
        run: |
          FIRST_TAG=$(echo "${{ steps.meta-backend.outputs.tags }}" | tr ',' '\n' | head -1)
          echo "image_ref=$FIRST_TAG" >> $GITHUB_OUTPUT

      - name: Scan backend image for vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ steps.backend-tag.outputs.image_ref }}
          format: sarif
          output: trivy-backend.sarif
          severity: HIGH,CRITICAL
          # Without this, format: sarif ignores `severity` (action default is all severities),
          # so 3 fixable MEDIUMs failed the gate on 2026-10-13 while 0 HIGH/CRITICAL existed.
          limit-severities-for-sarif: true
          exit-code: '1'
          # Gate on what can be fixed: findings with no published fix (most Debian
          # base-image HIGH/CRITICALs) are not actionable. Time-boxed exceptions for the
          # remaining fixable ones live in .trivyignore with reasons and expiry dates.
          ignore-unfixed: 'true'
          trivyignores: .trivyignore

      - name: Upload trivy backend scan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-backend
          path: trivy-backend.sarif
          retention-days: 30

      - name: Extract frontend metadata
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          # Scan-only tags here. `latest` is NEVER published from the mock
          # build below (it would bake mock Supabase values into a tag that
          # reads as deployable) — see the separate latest-with-secrets step.
          tags: |
            type=sha,prefix=,suffix=,format=short

      - name: Build & push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          # Mock values (same as lint-test.yml): this CI image is for scanning, not deploy.
          # The frontend is hosted on Lovable; a deployable image needs real values via secrets.
          build-args: |
            VITE_SUPABASE_URL=https://mock-supabase.supabase.co
            VITE_SUPABASE_PUBLISHABLE_KEY=mock-anon-key-for-ci-build
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check deployment eligibility
        id: deploy-gate
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ -n "${{ env.DEPLOY_SUPABASE_URL }}" ] && [ -n "${{ env.DEPLOY_SUPABASE_KEY }}" ]; then
            echo "eligible=true" >> $GITHUB_OUTPUT
          else
            echo "eligible=false" >> $GITHUB_OUTPUT
          fi

      - name: Build & push frontend candidate with real Supabase values
        # Deployable content, NOT yet the deployable tag: this publishes only
        # a -candidate tag, which the Trivy step below scans; `latest` is
        # promoted from the scanned image and never built separately, so the
        # scanned bytes and the published bytes are identical.
        # Skipped silently until both secrets exist (no failure: absence just
        # means no latest).
        if: steps.deploy-gate.outputs.eligible == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          build-args: |
            VITE_SUPABASE_URL=${{ env.DEPLOY_SUPABASE_URL }}
            VITE_SUPABASE_PUBLISHABLE_KEY=${{ env.DEPLOY_SUPABASE_KEY }}
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:candidate-${{ github.sha }}
          # Keep the OCI source/revision labels on the image that `latest` is promoted from.
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha

      - name: Scan frontend candidate image
        if: steps.deploy-gate.outputs.eligible == 'true'
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}:candidate-${{ github.sha }}
          format: sarif
          output: trivy-frontend-latest.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          exit-code: '1'
          ignore-unfixed: 'true'
          trivyignores: .trivyignore

      - name: Promote scanned candidate to latest
        # Only runs when the scan above passed: `latest` is the scanned image.
        # Note: The candidate image (candidate-${{ github.sha }}) is not deployable and may
        # remain published after a failed Trivy scan. Only :latest is promoted and deployable.
        if: steps.deploy-gate.outputs.eligible == 'true'
        run: |
          docker buildx imagetools create \
            --tag ${{ env.FRONTEND_IMAGE }}:latest \
            ${{ env.FRONTEND_IMAGE }}:candidate-${{ github.sha }}

      - name: Get frontend image tag for scanning
        id: frontend-tag
        run: |
          FIRST_TAG=$(echo "${{ steps.meta-frontend.outputs.tags }}" | tr ',' '\n' | head -1)
          echo "image_ref=$FIRST_TAG" >> $GITHUB_OUTPUT

      - name: Scan frontend image for vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ steps.frontend-tag.outputs.image_ref }}
          format: sarif
          output: trivy-frontend.sarif
          severity: HIGH,CRITICAL
          # Without this, format: sarif ignores `severity` (action default is all severities),
          # so 3 fixable MEDIUMs failed the gate on 2026-10-13 while 0 HIGH/CRITICAL existed.
          limit-severities-for-sarif: true
          exit-code: '1'
          # Gate on what can be fixed: findings with no published fix (most Debian
          # base-image HIGH/CRITICALs) are not actionable. Time-boxed exceptions for the
          # remaining fixable ones live in .trivyignore with reasons and expiry dates.
          ignore-unfixed: 'true'
          trivyignores: .trivyignore

      - name: Upload trivy frontend scan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-frontend
          path: trivy-frontend.sarif
          retention-days: 30
          if-no-files-found: warn

      - name: Upload trivy frontend candidate scan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-frontend-latest
          path: trivy-frontend-latest.sarif
          retention-days: 30
          if-no-files-found: warn
