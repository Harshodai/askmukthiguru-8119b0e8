[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    "*.ipynb",
    "colab/**",
    ".agent/**",
    ".agents/**",
    "node_modules/**",
    "playwright-report/**",
    "dist/**",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",  # Line length handled by formatter
    "E402",  # Module level import not at top of file (needed for path-patching scripts)
    "UP042", # Class inherits from both str and Enum (needed for backwards-compatible string enums)
    "B905",  # zip() strict= parameter (breaks compatibility with Python < 3.10)
    "B008",  # Depends function calls in FastAPI defaults
    "B904",  # exception chaining (raise from)
]

[tool.ruff.lint.isort]
# 2026-10-20: backend packages are first-party from BOTH script trees. Without
# this, `ruff check .` from the repo root classifies `app`/`services` as
# third-party for `scripts/ops/*.py` but first-party for their
# `backend/scripts/ops/*.py` twins (nearest-config resolution there sees
# backend/pyproject.toml). The two orderings are mutually exclusive, so
# test_repo_layout.py's "shared ops scripts are byte-identical" invariant and a
# green root lint gate could not both hold. Declaring the packages here makes one
# sorted order correct under both configs.
known-first-party = [
    "app",
    "benchmarks",
    "config",
    "domain",
    "guardrails",
    "ingest",
    "infrastructure",
    "memory",
    "models",
    "optimization",
    "rag",
    "routers",
    "schemas",
    "services",
    "tasks",
    "tests",
    "evaluation",
]
