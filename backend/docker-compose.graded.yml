# Graded clean-Docker run override (plan items F1 + F2, 2026-10-31).
#
#   cd backend && git status --porcelain            # must be empty
#   docker compose -f docker-compose.yml -f docker-compose.graded.yml up -d --build --force-recreate --no-deps backend
#   make flush-cache && make verify-cache-empty && make verify-stack-fresh
#   .venv/bin/python -m scripts.ops.graded_run_preflight --check-logs
#
# One file pins every serving flag, so a stage never inherits the previous stage's scratch
# YAML. Change ONE value per stage and record which one. The preflight diffs this
# `environment` block against the running container, so a drifted env aborts the run.
#
# What this file does NOT do: it never touches prod settings. The OpenRouter caps below are
# for the LOCAL eval container only (Harsha, 2026-10-31); prod keeps its cap, sized from
# expected daily volume with a 3x margin and an alert at 70%.
services:
  backend:
    environment:
      # Serving path: v10 only, harness on and terminal (no legacy v8 fall-through).
      FIRST_PERSON_MODE: retrieval_only
      FIRST_PERSON_ACTIVE_COLLECTION: first_person_v10
      FIRST_PERSON_CONTEXT_HARNESS_ENABLED: "true"
      FIRST_PERSON_CONTEXT_TERMINAL_ENABLED: "true"
      FIRST_PERSON_CONTEXT_CANDIDATE_LIMIT: "16"
      FIRST_PERSON_LLM_FALLBACK_ENABLED: "false"
      FIRST_PERSON_ENRICHMENT_WINDOW_ENABLED: "true"
      FIRST_PERSON_GRAPH_EXPANSION_ENABLED: "true"
      FIRST_PERSON_TEACHING_UNIT_GRAPH_ENABLED: "true"
      FIRST_PERSON_HYDE_ENABLED: "true"
      FIRST_PERSON_SERVE_WEAK_MATCH: "true"
      FIRST_PERSON_FACET_SPLIT_ENABLED: "true"
      FIRST_PERSON_COMPOUND_DIRECT_SERVING_ENABLED: "true"
      # 2026-11-12: FIRST_PERSON_UNCALIBRATED_DIRECT_ENABLED is no longer pinned on. The
      # Settings default (false) applies: a direct answer needs a calibration profile, and
      # the profile on file is UNPROVEN (see audits/evidence/CALIBRATION_PROVENANCE_2026-11-12.md).
      FIRST_PERSON_JUDGE_ENABLED: "true"
      # Pinned so a graded run reproduces from committed files (2026-11-13; graded-6 ran on the
      # Settings default, and its sparse setting lived only in an override outside the repo).
      FIRST_PERSON_JUDGE_MODEL: anthropic/claude-haiku-5.5
      # Comparative judge (candidate A for the same-clip defect) stays OFF in the graded
      # config until its negative-control measurement exists; switching it on is a new
      # registered run. Pinned so the manifest records the value (2026-11-13).
      FIRST_PERSON_COMPARATIVE_JUDGE_ENABLED: "false"
      # Graded-6 A/B setting (sparse retrieval OFF). The Settings default is still True and the
      # owner decision on the default is open; this pin only makes the graded config explicit.
      FIRST_PERSON_CONTEXT_USE_SPARSE: "false"
      # Pinned 2026-11-13 (harness audit H-12). The graded-6 manifest records this flag as
      # false, but the value came from .env: no committed file set it and the Settings
      # default is true. Pinned to the graded-6 value so graded-7 is comparable. Whether the
      # product should run with the YES/NO answerability gate on is owner decision T-E1.
      # graded-8 (registered 2026-11-14): the ONE value changed from graded-7. The run measures
      # what the YES/NO answerability gate does to served count, showable share and latency
      # (owner decision D1 needs that delta). Whether the product runs with it on stays D1.
      FIRST_PERSON_ANSWERABILITY_CHECK_ENABLED: "true"
      # Pinned 2026-11-13 (harness audit H-14). The ambiguous-domain router never completed
      # inside its 0.45 s budget (measured 470-690 ms), so every graded run so far routed as
      # if it were off. Pinned off so a faster network cannot change routing mid-comparison.
      INTENT_ROUTER_AMBIGUOUS_DOMAIN_ENABLED: "false"
      # Relevance scorer: the single variable a stage may change.
      FIRST_PERSON_RELEVANCE_MODEL: anthropic/claude-haiku-5.5
      FIRST_PERSON_RELEVANCE_MIN_SCORE: "3" # = base compose default and CLAUDE.md invariant 24; was 2
      OPENROUTER_EXTRA_ALLOWED_MODELS: "anthropic/claude-haiku-5.5"
      # 5 s turned slow provider replies into relevance_indeterminate abstains; Haiku verify
      # ran at a median of 1.8 s, max 2.6 s. D-PG13 decided by Harsha 2026-11-07: the
      # graded run is pinned at 12 s, so one stalled scorer cannot push a request past
      # the 10 s p95 bar. Everywhere else the Settings default (25 s) is the one source.
      FIRST_PERSON_RELEVANCE_TIMEOUT_S: "12"
      # Owner decisions recorded as pins (Opus plan O3 / O5): change only on Harsha's word.
      # 2026-11-12: FIRST_PERSON_REQUIRE_VOICE_METHOD is no longer pinned here. The Settings
      # default applies (false, owner decides). It is not a workaround: the pass bar's H2 gate
      # (0 served clips with an unverified speaker) is still checked by the grader, so a bare
      # flag that is served shows up as a failed gate instead of being hidden by a pin.
      FIRST_PERSON_SERVE_UNREGISTERED: "true" # O5: recorded pin; ingestion approvals are held by Harsha
      # The local file-review API must not exist in a graded stack.
      FIRST_PERSON_LOCAL_REVIEW_ENABLED: "false"
      # Tasks run inline locally (no worker container); recorded so latency is read correctly.
      CELERY_TASK_ALWAYS_EAGER: "true"
      # LOCAL eval caps (guard stays on and fail-closed).
      OPENROUTER_DAILY_BUDGET_USD: "100"
      OPENROUTER_MONTHLY_BUDGET_USD: "300"
      OPENROUTER_BUDGET_GUARD_ENABLED: "true"
      OPENROUTER_BUDGET_FAIL_CLOSED: "true"
    # `!override` REPLACES the base list. Application code is not mounted: the container runs
    # the code that `--build` copied from a clean tree. Only caches and data stay mounted.
    #
    # What this deliberately REMOVES versus the dev stack (2026-11-14: named because a
    # removed mount is invisible until a feature quietly reads it):
    #   - `../transcripts`  -> no `/app/transcripts`. The `GET /api/search/inspect-source`
    #     local-transcript fallback and any projected-transcript reader do not exist here.
    #     A 0-chunk inspect result in a graded stack is NOT evidence that the Qdrant path
    #     failed; check the collection for the video id before drawing a conclusion.
    #   - `../scripts`      -> no `/app/scripts` (see L-OPS-MOUNT-1; ops code must run via
    #     `app/backend_scripts` or a repo-root `scripts/ops/` wrapper).
    #   - `./app ./services ./rag ./domain ./guardrails ./routers ...` -> no live code
    #     reload. A graded run measures the image, which is the point.
    volumes: !override
      - hf_model_cache:/app/.cache
      - ./.model_cache:/app/model_cache
      - telemetry_data:/app/data
      - logs_data:/app/logs
      - ../memory:/app/memory
      - ../results:/app/results
      - ../audits:/app/audits:ro
      - ./config:/app/backend/config:ro
      - ../config:/config:ro
