# ============================================================
# Mukthi Guru — Full Stack Docker Compose
#
# Profiles:
#   (default)         — memgraph, redis, qdrant, backend, frontend
#   legacy-neo4j      — neo4j fallback (port 7689, enable: COMPOSE_PROFILES=legacy-neo4j)
#   ingestion         — celery-worker (enable: COMPOSE_PROFILES=ingestion)
#   observability     — jaeger, prometheus, grafana (enable: COMPOSE_PROFILES=observability)
#   cache             — gptcache-server (enable: COMPOSE_PROFILES=cache)
#
# Ollama runs on the HOST machine (not in Docker) because:
#   - Windows Docker doesn't support GPU passthrough easily
#   - Ollama Desktop is already installed and running
#   - The backend connects to Ollama via host.docker.internal
#
# Usage:
#   docker compose up -d                            # Start serving stack; no worker/tracing
#   COMPOSE_PROFILES=ingestion docker compose up -d       # + Celery ingestion worker
#   docker compose up -d   # tracing + metrics + dashboards included by default
#   COMPOSE_PROFILES=cache docker compose up -d           # + gptcache-server
#   COMPOSE_PROFILES=ingestion,observability,cache docker compose up -d  # everything
#   docker compose logs -f                          # Watch logs
#   docker compose down                             # Stop all services
# ============================================================

# Docker's default json-file log driver has no size cap -- left unset, a
# long-running container's stdout/stderr grows on disk without bound. None of
# the services below had this configured. Applied to the ones that actually
# produce sustained log volume in production (the app services and the
# databases they talk to on every request); left off the dev/observability
# extras (jaeger/prometheus/grafana/supabase-*/frontend/gptcache-server),
# which aren't part of the always-on default profile.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ============================================================
  # Graph Databases: Memgraph (Primary, 7687) & Neo4j (Fallback, 7689)
  # ============================================================

  # --- Memgraph (Primary Graph Database, port 7687, C++, ~80MB RAM) ---
  memgraph:
    image: memgraph/memgraph-mage:latest
    container_name: mukthiguru-memgraph
    logging: *default-logging
    ports:
      - "7687:7687" # Bolt Protocol (Primary)
      - "7444:7444" # WebSocket / Memgraph Lab
    environment:
      - MEMGRAPH_USER=${NEO4J_USER:-neo4j}
      - MEMGRAPH_PASSWORD=${NEO4J_PASSWORD:-mukthiguru_neo4j_pass}
    command: ["--memory-limit=512", "--bolt-port=7687", "--log-level=WARNING"]
    volumes:
      - memgraph_data:/var/lib/memgraph
    healthcheck:
      test: ["CMD-SHELL", "echo 'RETURN 1;' | mgconsole --username $${MEMGRAPH_USER:-neo4j} --password $${MEMGRAPH_PASSWORD:-mukthiguru_neo4j_pass} || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    restart: unless-stopped

  # --- Neo4j Database (Fallback / Legacy, port 7689, JVM, ~1GB+ RAM) ---
  neo4j:
    image: neo4j:5.17.0
    container_name: mukthiguru-neo4j
    profiles:
      - legacy-neo4j
    ports:
      - "7475:7474" # HTTP Browser (Fallback)
      - "7689:7687" # Bolt Protocol (Fallback)
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-mukthiguru_neo4j_pass}
      - NEO4J_PLUGINS=["apoc","n10s","graph-data-science"]
      - NEO4J_server_memory_heap_initial__size=${NEO4J_HEAP_INITIAL_SIZE:-256M}
      - NEO4J_server_memory_heap_max__size=${NEO4J_HEAP_MAX_SIZE:-512M}
      - NEO4J_server_memory_pagecache_size=${NEO4J_PAGECACHE_SIZE:-512M}
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
    restart: "no"

  # --- Redis Cache ---
  redis:
    image: redis:7-alpine
    container_name: mukthiguru-redis
    logging: *default-logging
    ports:
      - "6379:6379"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-mukthiguru_redis_pass}
      --appendonly yes
      --appendfsync everysec
      --save 900 1
      --save 300 10
      --save 60 10000
      --maxmemory 450mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-mukthiguru_redis_pass}", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.25'
    restart: unless-stopped

  # --- Observability / Tracing ---
  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    container_name: mukthiguru-jaeger
    # AMK-F-001: this service used to carry an `observability` compose
    # profile, so a plain `docker compose up -d` never started it. Meanwhile
    # OTEL_ENABLED defaulted to false AND Prometheus is configured
    # to scrape backend:8000/metrics — so the stack reported healthy while
    # discarding every span and scraping nothing. Observability that needs a
    # remembered flag is observability you do not have during the incident
    # that needed it. On by default now; drop it with `--scale <svc>=0`.
    restart: unless-stopped
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # Web UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'

  qdrant:
    image: qdrant/qdrant:v1.18.0
    container_name: mukthiguru-qdrant
    logging: *default-logging
    ports:
      - "6333:6333" # REST API
      - "6334:6334" # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      test: [ "CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/localhost/6333'" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: '2.0'
    restart: unless-stopped

  # --- FastAPI Backend ---
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: mukthiguru-backend
    labels:
      - "autoheal=true"
      # AMK-B-002: covers the Exited/SIGKILL class autoheal cannot see.
      - "liveness-watchdog=true"
    logging: *default-logging
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment: &backend-env
      # Bound numeric-library thread pools (2026-09-06, fix for L-DOCKER-9:
      # RuntimeError: can't start new thread under load). MKL/OpenBLAS/OMP
      # each detect the HOST's full core count inside a container rather
      # than the `cpus: '4.0'` limit below, and each spawns its OWN thread
      # pool sized to that inflated count — torch, numpy/BLAS, and OpenMP
      # compounding independently, multiplied across every concurrent
      # request's embedding/reranking calls, is what actually exhausted the
      # container's ability to spawn new OS threads, not a Python-level
      # executor leak (confirmed: cgroup pids.current was only 30 when it
      # broke, well under any pids limit).
      # AMK-F-001: credential for the Prometheus scrape of
      # /internal/metrics. Unset = that endpoint 404s and the scrape target
      # shows DOWN, which is a visible failure rather than a silent one.
      - METRICS_SCRAPE_TOKEN=${METRICS_SCRAPE_TOKEN:-}
      - OMP_NUM_THREADS=2
      - MKL_NUM_THREADS=2
      - OPENBLAS_NUM_THREADS=2
      - NUMEXPR_NUM_THREADS=2
      # HF_HUB_OFFLINE removed — Llama Guard needs runtime download; embedding
      # models are pre-cached at build time so they load without network.
      # === LLM Provider ===
      # "openrouter" (default), "sarvam_cloud", or "ollama" (requires Ollama on host)
      - LLM_PROVIDER=${LLM_PROVIDER:-openrouter}
      # --- Sarvam Cloud API (config-driven — any model name works) ---
      - SARVAM_API_KEY=${SARVAM_API_KEY:-}
      - SARVAM_CLOUD_MODEL=${SARVAM_CLOUD_MODEL:-sarvam-30b}
      - SARVAM_CLOUD_CLASSIFY_MODEL=${SARVAM_CLOUD_CLASSIFY_MODEL:-sarvam-30b}
      - SARVAM_BASE_URL=${SARVAM_BASE_URL:-https://api.sarvam.ai/v1}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-60}
      - PIPELINE_TIMEOUT=${PIPELINE_TIMEOUT:-300}
      - LLM_MAX_RETRIES=${LLM_MAX_RETRIES:-2}
      - SARVAM_REASONING_EFFORT=${SARVAM_REASONING_EFFORT:-medium}
      - SARVAM_REASONING_EFFORT_FAST=${SARVAM_REASONING_EFFORT_FAST:-low}
      - SARVAM_REASONING_EFFORT_COMPLEX=${SARVAM_REASONING_EFFORT_COMPLEX:-high}
      - SARVAM_RPM_LIMIT=${SARVAM_RPM_LIMIT:-60}
      - SARVAM_DAILY_BUDGET_USD=${SARVAM_DAILY_BUDGET_USD:-10.0}
      - SARVAM_MONTHLY_BUDGET_USD=${SARVAM_MONTHLY_BUDGET_USD:-100.0}
      - SARVAM_MAX_REQUEST_COST_USD=${SARVAM_MAX_REQUEST_COST_USD:-0.05}
      - SARVAM_BUDGET_GUARD_ENABLED=${SARVAM_BUDGET_GUARD_ENABLED:-true}
      - SERENE_MIND_ENABLED=${SERENE_MIND_ENABLED:-true}
      # --- OpenRouter (free tier for simple queries) ---
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - USE_OPENROUTER_FOR_SIMPLE=${USE_OPENROUTER_FOR_SIMPLE:-true}
      - OPENROUTER_FAST_MODEL=${OPENROUTER_FAST_MODEL:-meta-llama/llama-3.1-8b-instruct}
      - OPENROUTER_GENERATION_MODEL=${OPENROUTER_GENERATION_MODEL:-deepseek/deepseek-chat}
      - OPENROUTER_GENERATION_MODEL_FALLBACK=${OPENROUTER_GENERATION_MODEL_FALLBACK:-meta-llama/llama-3.3-70b-instruct}
      - OPENROUTER_CLASSIFY_MODEL=${OPENROUTER_CLASSIFY_MODEL:-meta-llama/llama-3.1-8b-instruct}
      - OPENROUTER_PROVIDER_SORT=${OPENROUTER_PROVIDER_SORT:-}
      - OPENROUTER_PROVIDER_PARTITION=${OPENROUTER_PROVIDER_PARTITION:-model}
      - OPENROUTER_PREFERRED_MAX_LATENCY_P90=${OPENROUTER_PREFERRED_MAX_LATENCY_P90:-0}
      - OPENROUTER_PREFERRED_MIN_THROUGHPUT_P90=${OPENROUTER_PREFERRED_MIN_THROUGHPUT_P90:-0}
      - OPENROUTER_RPM_LIMIT=${OPENROUTER_RPM_LIMIT:-20}
      - OPENROUTER_DAILY_BUDGET_USD=${OPENROUTER_DAILY_BUDGET_USD:-10.0}
      - OPENROUTER_MONTHLY_BUDGET_USD=${OPENROUTER_MONTHLY_BUDGET_USD:-100.0}
      - OPENROUTER_MAX_REQUEST_COST_USD=${OPENROUTER_MAX_REQUEST_COST_USD:-0.03}
      - OPENROUTER_BUDGET_GUARD_ENABLED=${OPENROUTER_BUDGET_GUARD_ENABLED:-true}
      - OPENROUTER_BUDGET_FAIL_CLOSED=${OPENROUTER_BUDGET_FAIL_CLOSED:-true}
      # --- Nvidia NIM (hosted API Catalog) ---
      - NIM_API_KEY=${NIM_API_KEY:-}
      - NIM_BASE_URL=${NIM_BASE_URL:-https://integrate.api.nvidia.com/v1}
      - NIM_GENERATION_MODEL=${NIM_GENERATION_MODEL:-minimaxai/minimax-m2.7}
      - NIM_CLASSIFY_MODEL=${NIM_CLASSIFY_MODEL:-meta/llama-3.1-8b-instruct}
      - NIM_RPM_LIMIT=${NIM_RPM_LIMIT:-30}
      # --- Guardrails ---
      - GUARDRAILS_PROVIDER=${GUARDRAILS_PROVIDER:-nemo}
      - HF_TOKEN=${HF_TOKEN:-}
      # --- Retrieval Quality ---
      - RERANK_MIN_SCORE=${RERANK_MIN_SCORE:-0.15}
      - SEMANTIC_CACHE_ENABLED=${SEMANTIC_CACHE_ENABLED:-true}
      - SEMANTIC_CACHE_SIMILARITY=${SEMANTIC_CACHE_SIMILARITY:-0.92}
      # RAG latency controls are explicit here so Compose overrides are not
      # silently shadowed by values from the root env_file.
      # Preserve the pre-existing local global settings (HyDE=true, two
      # rewrites) while making the safer Indic policy explicit below.
      - RAG_USE_HYDE=${RAG_USE_HYDE:-true}
      - RAG_INDIC_USE_HYDE=${RAG_INDIC_USE_HYDE:-false}
      - RAG_MAX_REWRITES=${RAG_MAX_REWRITES:-2}
      - RAG_INDIC_MAX_REWRITES=${RAG_INDIC_MAX_REWRITES:-1}
      - CACHE_MODE=${CACHE_MODE:-best_effort}
      - LATENCY_BENCHMARK_CACHE_DISABLED=${LATENCY_BENCHMARK_CACHE_DISABLED:-false}
      - RAG_RETRIEVAL_EXPANSION_SOFT_WAIT_SECONDS=${RAG_RETRIEVAL_EXPANSION_SOFT_WAIT_SECONDS:-0.35}
      # --- Observability ---
      - ENABLE_CORRELATION_IDS=${ENABLE_CORRELATION_IDS:-true}
      # --- Ollama (only used when LLM_PROVIDER=ollama) ---
      # Model Preset: "qwen" (default) or "sarvam" (requires custom GGUF import)
      - MODEL_PRESET=${MODEL_PRESET:-qwen}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-deepseek-v4-flash:cloud}
      - OLLAMA_CLASSIFY_MODEL=${OLLAMA_CLASSIFY_MODEL:-deepseek-v4-flash:cloud}
      - OLLAMA_FAST_MODEL=${OLLAMA_FAST_MODEL:-deepseek-v4-flash:cloud}
      # Ollama runs on the HOST, not in Docker
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      # Qdrant runs as a sibling container
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-spiritual_wisdom_contextual}
      - QDRANT_LOCAL_PATH=
      # Supabase
      - SUPABASE_URL=${SUPABASE_URL:-http://host.docker.internal:54321}
      - SUPABASE_KEY=${SUPABASE_KEY:-}
      # Graph DB (Memgraph on port 7687)
      - NEO4J_URI=bolt://memgraph:7687
      - MEMGRAPH_URI=bolt://memgraph:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:?NEO4J_PASSWORD must be set}
      # Embedding models (downloaded on first run)
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-BAAI/bge-m3}
      - EMBEDDING_DIMENSION=${EMBEDDING_DIMENSION:-1024}
      - EMBEDDING_BACKEND=${EMBEDDING_BACKEND:-onnx_int8}
      - RERANKER_BACKEND=${RERANKER_BACKEND:-onnx_int8}
      - RERANKER_MODEL=cross-encoder/ms-marco-MiniLM-L-6-v2
      # Model cache on overlay filesystem (NOT on hf_model_cache volume)
      # to avoid Docker Desktop gRPC-FUSE mmap failures on large .safetensors files.
      - HF_HOME=/app/model_cache/huggingface
      - TRANSFORMERS_CACHE=/app/model_cache/huggingface
      - SENTENCE_TRANSFORMERS_HOME=/app/model_cache/sentence_transformers
      # Whisper / Transcription — WHISPER_MODEL / WHISPER_BACKEND /
      # WHISPER_COMPUTE_TYPE were set here but read by nothing; removed rather
      # than renamed. The live path is WhisperX, whose defaults (model large-v3,
      # device auto, compute_type auto) already match what these claimed.
      # compute_type is deliberately NOT pinned to float16: that was never in
      # effect, and forcing it on a CPU host fails at load. Set WHISPERX_* here
      # only after measuring on the target hardware.
      - TRANSCRIPT_LANGUAGES=en,hi,bn,te,mr,ta,ur,gu,kn,ml,or,pa,as,mai,sa,ks,ne,sd,kok,doi,mni,sat,brx
      - TRANSCRIPT_CONCURRENT_WORKERS=4
      - OCR_LANGUAGES=en,hi
      # Redis cache
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0
      # Local dev only: run .delay() tasks synchronously in this process
      # instead of dispatching to a separate celery-worker container.
      - CELERY_TASK_ALWAYS_EAGER=${CELERY_TASK_ALWAYS_EAGER:-false}
      # OpenTelemetry
      # Tracing is opt-in locally because Jaeger is an observability profile.
      # AMK-F-001: defaulted to false, and the collector was profile-gated,
      # so tracing was off twice over. Both are on by default now; set
      # OTEL_ENABLED=false to opt out. `app/observability.py` probes the
      # collector at startup and warns loudly if nothing is listening, so a
      # misconfigured endpoint is visible instead of silently dropping spans.
      - OTEL_ENABLED=${OTEL_ENABLED:-true}
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_SERVICE_NAME=mukthiguru-backend
      - OTEL_PYTHON_FASTAPI_EXCLUDED_URLS=^(?!.*\/api\/chat(?:\/stream)?(?:\?.*)?$).*
      - OPENINFERENCE_HIDE_EMBEDDINGS_VECTORS=true
      # Server
      - HOST=0.0.0.0
      - PORT=8000
      - MAX_CONCURRENT_CHAT=${MAX_CONCURRENT_CHAT:-8}
      # Workers: default to 1 worker for development to prevent OOM errors on resource-limited
      # Docker hosts. Can be scaled up in production by setting WEB_CONCURRENCY env var.
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-1}
      # Disable Sarvam debug log (prevents unbounded sarvam_debug.json growth)
      - SARVAM_DEBUG=false
      # Reranker: prefer FlashRank API path; image falls back to CrossEncoder automatically
      - USE_FLASHRANK=${USE_FLASHRANK:-true}
      # Auth
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      # ⚠️ PRODUCTION: MUST be set to the actual frontend domain (e.g. https://yourdomain.com).
      #   Leaving it as localhost origins in production is a security risk.
      #   Example: CORS_ORIGINS=https://app.yourdomain.com
      - CORS_ORIGINS=${CORS_ORIGINS:?CORS_ORIGINS must be set to allowed origins}
    depends_on:
      memgraph:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 420s
    deploy:
      resources:
        limits:
          # Raised 4G->6G (2026-09-05, handoff.md item #6): the container sat
          # at 99% of the 4G limit at idle startup alone (ONNX embedding +
          # reranker + BGE-M3 late-chunk backbone, ~2.9G of that is documented
          # as deliberate in embedding_service.py), leaving zero headroom for
          # the first real request's additional model loads -> OOM-killed by
          # the cgroup limit, not a code bug.
          #
          # Measured 2026-09-12 on a 7.75GiB Docker VM: boots healthy, peaks
          # 4.55GiB during model load, settles at ~2.57GiB (43% of this limit)
          # and serves real chat requests. 6G is the right ceiling — the earlier
          # "container OOMs 137" report did NOT reproduce (OOMKilled=false). One
          # worker did die once, but on a native SIGSEGV inside turbovec, not on
          # memory; see TURBOQUANT_NATIVE_ENABLED in services/turboquant_cache.py.
          # Note the limits across all services (qdrant 3G + neo4j 2G + redis
          # 512M + this) exceed a 8GB VM, so raise Docker Desktop's memory
          # allocation before running the full stack under load.
          memory: ${BACKEND_MEMORY_LIMIT:-6G}
          cpus: ${BACKEND_CPU_LIMIT:-4.0}
    restart: unless-stopped
    volumes: &backend-volumes
      # Cache HuggingFace models across rebuilds (prevents re-download on every docker build)
      - hf_model_cache:/app/.cache
      - ./.model_cache:/app/model_cache
      # Persist SQLite telemetry database
      - telemetry_data:/app/data
      # Persist compliance and audit logs
      - logs_data:/app/logs
      # Mount backend code and scripts for live-reloading/direct execution
      - ./app:/app/app
      - ./domain:/app/domain
      - ./rag:/app/rag
      - ./services:/app/services
      - ./guardrails:/app/guardrails
      - ./routers:/app/routers
      - ./schemas:/app/schemas
      - ./tests:/app/tests
      - ./benchmarks:/app/benchmarks
      - ./tasks:/app/tasks
      - ../scripts:/app/scripts
      - ../results:/app/results
      - ../memory:/app/memory
      # NOTE: the ./repos/LightRAG/lightrag override mount was removed — backend/repos/
      # was deleted (P2 cleanup) and the empty host dir shadowed the pip-installed
      # lightrag-hku, causing "cannot import name 'LightRAG'" boot crash-loops.
    # Allow access to host's Ollama (if LLM_PROVIDER=ollama)
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # --- Celery Worker (playlist ingestion + OKF extraction/compile) ---
  # Fix: ingest_tasks.ingest_playlist / okf_extract_tasks / okf_compile_tasks were
  # enqueued to Redis but nothing consumed them — playlist ingestion from the admin
  # UI silently hung forever. Reuses the backend image/env via the &backend-env anchor.
  celery-worker:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: mukthiguru-celery-worker
    profiles: [ingestion]
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "celery -A celery_config inspect ping -d celery@$$HOSTNAME --timeout 5 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    env_file:
      - ../.env
    environment: *backend-env
    command: >
      celery -A celery_config worker
      --loglevel=info
      --queues=transcription,embedding,indexing,ingestion,okf,memory
      --concurrency=${CELERY_CONCURRENCY:-1}
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      memgraph:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 3G
    restart: unless-stopped
    volumes: *backend-volumes
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # --- Frontend (Nginx Proxy) ---
  frontend:
    build:
      context: ..
      dockerfile: frontend.Dockerfile
      args:
        VITE_SUPABASE_URL: ${PUBLIC_SUPABASE_URL:-http://localhost:54321}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_ANON_KEY}
        VITE_USE_NATIVE_OAUTH: ${USE_NATIVE_OAUTH:-true}
        VITE_JAEGER_UI_URL: ${VITE_JAEGER_UI_URL:-http://localhost:16686}
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        # The frontend is served behind Nginx, which proxies /api to backend.
        # Keep the default same-origin; explicit staging/native overrides remain supported.
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-}
    container_name: mukthiguru-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
  # --- GPTCache Server (Distributed Semantic Cache) ---
  # Overrides command to uninstall broken 'faiss' package and install 'faiss-cpu'
  # to fix the 'AttributeError: module faiss has no attribute index_factory' crash.
  gptcache-server:
    platform: linux/amd64
    image: zilliz/gptcache:0.1.44
    container_name: mukthiguru-gptcache-server
    profiles: [cache]
    ports:
      - "8001:8000"
    environment:
      - GPTCACHE_CONFIG=/config/gptcache_config.yml
    command: >
      sh -c "pip uninstall -y faiss faiss-cpu && pip install --no-cache-dir faiss-cpu && exec gptcache_server -s 0.0.0.0 -p 8000 -d /data"
    volumes:
      - ../gptcache_config.yml:/config/gptcache_config.yml:ro
      - gptcache_data:/data
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Checks /api/health, not / (2026-09-06, fix for L-DOCKER-11's silent
      # hang): the root path is a trivial static route that stayed
      # responsive through a real 7+ minute hang where /api/chat and
      # /api/health themselves were stuck, because it never touches the
      # request-processing path that got starved. A healthcheck that can't
      # detect the one failure mode actually observed in production testing
      # is worse than no healthcheck -- it hides the outage instead of
      # surfacing it. timeout=8s bounds a single slow-but-alive response;
      # 3 consecutive misses (interval 10s) x 8s timeout means a genuine
      # hang is caught within ~30-54s instead of never.
      test: ["CMD-SHELL", "python -c \"import http.client; conn = http.client.HTTPConnection('localhost', 8000, timeout=8); conn.request('GET', '/api/health'); r = conn.getresponse(); import sys; sys.exit(0 if r.status < 500 else 1)\" || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'


  # --- Prometheus Monitoring Scraper ---
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: mukthiguru-prometheus
    # AMK-F-001: on by default — see the note on the jaeger service above.
    ports:
      - "9090:9090"
    volumes:
      - ../infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../infrastructure/prometheus/alerting-rules.yml:/etc/prometheus/alerting-rules.yml:ro
      - prometheus_data:/prometheus
    environment:
      # Read by the entrypoint below and written to a file, because Prometheus
      # does no variable interpolation in its own config and its
      # `credentials_file` wants a path. Keeping the secret in the environment
      # means it is never committed — same rule as every other secret here.
      - METRICS_SCRAPE_TOKEN=${METRICS_SCRAPE_TOKEN:-}
    entrypoint:
      - /bin/sh
      - -c
      - |
        printf '%s' "$$METRICS_SCRAPE_TOKEN" > /etc/prometheus/scrape_token
        chmod 600 /etc/prometheus/scrape_token
        exec /bin/prometheus \
          --config.file=/etc/prometheus/prometheus.yml \
          --storage.tsdb.path=/prometheus \
          --web.console.libraries=/usr/share/prometheus/console_libraries \
          --web.console.templates=/usr/share/prometheus/consoles
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # --- Alertmanager (SLO alerting-rules.yml routes here) ---
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: mukthiguru-alertmanager
    # AMK-F-001: on by default — see the note on the jaeger service above.
    ports:
      - "9093:9093"
    volumes:
      # AMK-F-001: alertmanager.yml is the PRODUCTION artifact and still
      # holds unrendered ${PD_SERVICE_KEY}/${SLACK_WEBHOOK_URL} placeholders,
      # which Alertmanager rejects at config load. Mount the self-contained
      # local config instead; render the template to a separate file for prod.
      - ../infrastructure/prometheus/alertmanager.local.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'

  # --- Grafana Analytics Dashboard ---
  grafana:
    image: grafana/grafana:10.4.1
    container_name: mukthiguru-grafana
    # AMK-F-001: on by default — see the note on the jaeger service above.
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_ANONYMOUS_ORG_NAME=Main Org.
    volumes:
      - ../infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # --- Supabase local dev stack (profile: supabase) ---
  # Start with: COMPOSE_PROFILES=supabase docker compose up -d supabase-db supabase-meta supabase-auth supabase-rest supabase-kong
  # Backend SUPABASE_URL should be http://supabase-kong:8000 when running inside Docker
  # or http://localhost:54321 when running on the host.

  supabase-db:
    image: supabase/postgres:15.8.1.085
    container_name: mukthiguru-supabase-db
    profiles: [supabase]
    restart: unless-stopped
    ports:
      - "54322:5432"
    environment:
      POSTGRES_PASSWORD: ${SUPABASE_DB_PASSWORD:-mukthiguru_supabase_db}
      POSTGRES_DB: postgres
    volumes:
      - supabase_db_data:/var/lib/postgresql/data
      # NOTE: migrations applied post-boot via: docker exec -i mukthiguru-supabase-db psql -U postgres < migration.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  supabase-auth:
    image: supabase/gotrue:v2.185.0
    container_name: mukthiguru-supabase-auth
    profiles: [supabase]
    restart: unless-stopped
    depends_on:
      supabase-db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: "0.0.0.0"
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${PUBLIC_SUPABASE_URL:-http://localhost:54321}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${SUPABASE_DB_PASSWORD:-mukthiguru_supabase_db}@supabase-db:5432/postgres
      GOTRUE_SITE_URL: ${SITE_URL:-http://localhost:3000}
      GOTRUE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_SMTP_ADMIN_EMAIL: admin@askmukthiguru.ai
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:-}
      GOTRUE_SMTP_SENDER_NAME: AskMukthiGuru
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'

  supabase-rest:
    image: postgrest/postgrest:v14.3
    container_name: mukthiguru-supabase-rest
    profiles: [supabase]
    restart: unless-stopped
    depends_on:
      supabase-db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${SUPABASE_DB_PASSWORD:-mukthiguru_supabase_db}@supabase-db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage,graphql_public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${SUPABASE_JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${SUPABASE_JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      PGRST_APP_SETTINGS_JWT_EXP: 3600
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'

  supabase-meta:
    image: supabase/postgres-meta:v0.95.2
    container_name: mukthiguru-supabase-meta
    profiles: [supabase]
    restart: unless-stopped
    depends_on:
      supabase-db:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: supabase-db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: supabase
      PG_META_DB_PASSWORD: ${SUPABASE_DB_PASSWORD:-mukthiguru_supabase_db}
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

  supabase-kong:
    image: kong:2.8.1
    container_name: mukthiguru-supabase-kong
    profiles: [supabase]
    restart: unless-stopped
    depends_on:
      supabase-db:
        condition: service_healthy
    ports:
      - "54321:8000"  # <- This is the SUPABASE_URL port; host:container
      - "54323:8443"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /var/lib/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 16k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 8 16k
    volumes:
      - ./supabase/kong.yml:/var/lib/kong/kong.yml:ro
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # Auto-restarts any container labeled autoheal=true when Docker marks it
  # unhealthy. Added 2026-09-06 (L-DOCKER-11): a correct healthcheck alone
  # only makes a hang *visible* -- plain `docker compose`/`restart:` only
  # reacts to a process exiting, never to a healthcheck going unhealthy
  # while the process is still technically alive (exactly what happened:
  # backend hung 7+ minutes, stayed "healthy" the whole time under the old
  # root-path check, and even with the corrected /api/health check would
  # just sit "unhealthy" forever without something to act on it).
  #
  # VERIFIED 2026-09-15: this only helps if the container is actually
  # running. `docker ps -a --filter name=autoheal` returned zero rows on
  # this host during a live backend-unresponsive incident -- the backend
  # correctly reported "unhealthy" for 5 hours and nothing acted on it,
  # because this service was never started. `docker compose up -d
  # <service list>` with a partial list (e.g. this repo's own documented
  # `docker compose up -d qdrant redis neo4j jaeger`) silently excludes it
  # since it carries no `profiles:`. A bare `docker compose up -d` (no
  # service list) DOES start it. Confirm with `docker ps --filter
  # name=autoheal` after bringing the stack up; if it's missing, `docker
  # compose up -d autoheal` explicitly. Not relevant to the Railway
  # deployment target -- Railway's own healthcheck/restart
  # (railway.json's healthcheckPath=/api/healthz + restartPolicyType) is
  # independent of this sidecar and of the deep /api/health check.
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: mukthiguru-autoheal
    restart: unless-stopped
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=10
      - AUTOHEAL_START_PERIOD=60
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  # AMK-B-002: autoheal above watches Docker HEALTHCHECK transitions, so it
  # only ever sees a container that is RUNNING and reporting unhealthy. The
  # crash class that actually took the backend down was `Exited (137)` — a
  # SIGKILL from the host OOM killer — where there is no running container
  # left to report anything. autoheal logged nothing for the whole window and
  # `restart: unless-stopped` was observed not to bring it back either; a human
  # had to run `docker start`. This sidecar covers that gap and nothing else.
  #
  # Opt a container in with `liveness-watchdog=true`, NOT the autoheal label,
  # so the two watchdogs can be scoped independently.
  #
  # Exit codes 0 and 143 are treated as intentional shutdowns (`docker stop` /
  # `docker compose stop`) and left alone. A `docker kill` also exits 137 and
  # WILL be restarted — stop the watchdog first if that is what you meant.
  liveness-watchdog:
    image: docker:27-cli
    container_name: mukthiguru-liveness-watchdog
    restart: unless-stopped
    environment:
      - WATCH_LABEL=liveness-watchdog=true
      - WATCH_INTERVAL=${LIVENESS_WATCHDOG_INTERVAL:-15}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - sh
      - -c
      - |
        echo "[liveness-watchdog] watching label=$$WATCH_LABEL every $${WATCH_INTERVAL}s"
        while true; do
          for c in $$(docker ps -a --filter "label=$$WATCH_LABEL" --filter "status=exited" --filter "status=dead" --format '{{.Names}}'); do
            code=$$(docker inspect --format '{{.State.ExitCode}}' "$$c" 2>/dev/null || echo "")
            if [ "$$code" = "0" ] || [ "$$code" = "143" ]; then
              echo "[liveness-watchdog] $$c exited $$code (intentional) — leaving stopped"
              continue
            fi
            echo "[liveness-watchdog] $$c is down with exit code $$code — restarting"
            docker start "$$c" >/dev/null 2>&1 \
              && echo "[liveness-watchdog] $$c restarted" \
              || echo "[liveness-watchdog] $$c restart FAILED"
          done
          sleep "$$WATCH_INTERVAL"
        done

volumes:
  gptcache_data:
    driver: local
  qdrant_data:
    driver: local
  memgraph_data:
    driver: local
  neo4j_data:
    driver: local
  redis_data:
    driver: local
  hf_model_cache:
    driver: local
  telemetry_data:
    driver: local
  logs_data:
    driver: local
  prometheus_data:
    driver: local
  alertmanager_data:
    driver: local
  grafana_data:
    driver: local
  supabase_db_data:
    driver: local
