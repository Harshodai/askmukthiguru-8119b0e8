server {
    listen 80;
    server_tokens off;
    # Keep SPA directory redirects relative — nginx's implicit redirect from
    # /knowledge-graph (matches the prerendered dist/knowledge-graph/
    # directory via try_files $uri/) to /knowledge-graph/ otherwise emits an
    # absolute URL built from the container's own host:port, which breaks
    # behind Docker port-mapping / reverse proxies. Mirrors the root-level
    # nginx.conf fix for the same class of bug.
    absolute_redirect off;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Block access to .env and other sensitive files
    location ~ /\.env {
        deny all;
        return 404;
    }
    
    location ~ /\.git {
        deny all;
        return 404;
    }

    # Static + prerendered route serving. Vite build writes route HTML under
    # dist/<route>/index.html; unknown paths must not silently receive the SPA
    # shell because that produces false 200s for crawlers and broken links.
    root /usr/share/nginx/html/app;
    index index.html;
    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /404.html {
        internal;
    }

    # Legacy workspace aliases. Preserve return-to and conversation query state.
    location = /wisdom-map {
        return 301 /knowledge-graph$is_args$args;
    }

    location = /reflections {
        return 301 /second-brain$is_args$args;
    }

    # Static assets cache — preserve server-level security headers by
    # repeating them here. Nginx `add_header` in a location block replaces
    # inherited headers unless re-declared.
    location ~* \.(js|css|png|jpe?g|gif|webp|avif|ico|woff2?|ttf|eot|svg|json|webmanifest)$ {
        # Do not let a missing executable/static asset fall through to a route
        # shell. A false 200 hides broken hashed bundles from browsers.
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public, max-age=3600, immutable" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}
